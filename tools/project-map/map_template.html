<script>
'use strict';
const D=JSON.parse(document.getElementById('project-data').textContent);
const P=Object.fromEntries(D.projects.map(p=>[p.id,p]));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const views=['journey','projects','connections','thesis','evidence'];
let state={view:'journey',project:'valdx',source:null,edge:null,detail:'claims',query:'',connectionFilter:'all',sourceFilter:'all'};
function chips(ids){return `<div class="sources">${ids.map(id=>{const e=D.evidence[id];return `<button class="source-chip" data-source="${esc(id)}" title="${esc(e.path)} · lines ${e.start}–${e.end}">${esc(e.label)}<span>${e.start}–${e.end}</span></button>`}).join('')}</div>`}
function badge(kind,basis){return `<span class="badge ${kind==='negative'?'negative':kind==='historical'?'historical':''}">${esc(kind)}</span>${basis?`<span class="basis">${basis==='inferred'?'Narrative inference':'Source-stated'}</span>`:''}`}
function head(title,description,right=''){return `<div class="view-head"><div><h2>${esc(title)}</h2><p>${esc(description)}</p></div>${right}</div>`}
function stageCard(s){const p=P[s.project];return `<article class="stage ${s.branch?'branch':''}" style="--accent:${p?.color||'#227b70'}"><div class="num">${esc(s.number)}</div><div><p class="eyebrow">${esc(s.kicker)}</p><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p><div class="stage-footer"><strong>${esc(s.takeaway)}</strong>${p?`<button class="text-button" data-project="${p.id}">Explore ${esc(p.name)} ↗</button>`:''}</div>${!p?chips(s.sources):''}</div></article>`}
function journey(){return head('The research argument','A thematic progression through the programme, with titration shown as a related branch.',`<span class="small-label">4 projects · 1 guidance workstream</span>`)+`<div class="journey-summary"><strong>Compare, diagnose, and refine structural explanations.</strong>${esc(D.meta.summary)}</div><div class="stage-list">${D.journey.filter(s=>!s.branch).map(stageCard).join('')}</div><p class="branch-label">Related methodological branch</p>${D.journey.filter(s=>s.branch).map(stageCard).join('')}`}
function projectCard(p){return `<button class="project-card ${p.parent?'subproject':''} ${state.project===p.id?'selected':''}" data-project="${p.id}" style="--accent:${p.color}" aria-pressed="${state.project===p.id}"><div class="card-top"><span class="chapter">${p.parent?'Chapter 5 workstream':'Chapter '+p.chapter}</span><span class="verb">${esc(p.verb)}</span></div><h3>${esc(p.name)}</h3><p>${esc(p.tagline)}</p><span class="status">${esc(p.status)}</span></button>`}
function projects(){return head('Questions and contributions','Select a project to inspect its claims, experiments, code, and interpretation limits.')+`<div class="project-grid">${D.projects.filter(p=>!p.parent).map(projectCard).join('')}${D.projects.filter(p=>p.parent).map(projectCard).join('')}</div><p class="provenance">Status follows the project sources. Implemented capabilities, manuscript findings, and reported numerical checks are labelled separately.</p>`}
const positions={valdx:[5,12],jaxent:[37.5,12],biofeaturisers:[70,12],'maxent-fk':[37.5,62],'jax-ka':[70,62]};
function connections(){const edges=D.connections.filter(e=>state.connectionFilter==='all'||e.type===state.connectionFilter);return head('How the work connects','Solid lines show cited software dependencies; dashed lines show a narrative synthesis.',`<select class="filter" id="connection-filter" aria-label="Filter connection type"><option value="all">All connections</option><option value="dependency" ${state.connectionFilter==='dependency'?'selected':''}>Software dependencies</option><option value="conceptual" ${state.connectionFilter==='conceptual'?'selected':''}>Conceptual connections</option></select>`)+`<div class="graph-wrap"><div class="graph" aria-label="Research connections diagram"><svg viewBox="0 0 800 444" aria-hidden="true"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#568773"/></marker><marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#999e91"/></marker></defs>${edges.map(e=>{const paths={'validation-to-inference':'M240 113 L300 113','validation-to-guidance':'M140 173 C140 235 230 333 300 333','jaxent-to-guidance':'M400 173 L400 275','observables-to-guidance':'M560 150 C530 190 540 265 500 307','fitting-to-observables':'M500 113 L560 113','observables-to-titration':'M660 173 L660 275'};return `<path d="${paths[e.id]}" fill="none" stroke="${e.type==='dependency'?'#568773':'#999e91'}" stroke-width="1.7" ${e.type==='conceptual'?'stroke-dasharray="5 5"':''} marker-end="url(#${e.type==='dependency'?'arrow':'arrow-muted'})"/>`}).join('')}</svg>${D.projects.map(p=>`<button class="graph-node ${state.project===p.id?'selected':''}" data-project="${p.id}" style="left:${positions[p.id][0]}%;top:${positions[p.id][1]}%;--accent:${p.color}"><strong>${esc(p.name)}</strong><span>${esc(p.verb)} · ${p.parent?'Ch. 5 workstream':'Chapter '+p.chapter}</span></button>`).join('')}</div></div><div class="legend"><span><i></i>Cited dependency</span><span><i class="dashed"></i>Inferred research connection</span></div>${edges.map(e=>`<button class="connection ${state.edge===e.id?'selected':''}" data-edge="${e.id}"><div class="route">${esc(P[e.source].name)} → ${esc(P[e.target].name)} · ${e.type==='dependency'?'Software dependency':'Conceptual connection'}</div><h3>${esc(e.title)}</h3><p>${esc(e.text)}</p></button>`).join('')}`}
function outlineRows(headings,chapter=''){return headings.map(h=>`<div class="outline-row depth-${h.level}"><span class="heading-number">${esc(chapter?chapter+'.'+h.number:h.number)}</span><span>${esc(h.title)}</span></div>`).join('')}
function thesis(){return head('The thesis structure','The current chapter order and section headings, extracted directly from your LaTeX files.')+`<div class="chapter-bridge">Chapters 1–2 establish the problem and shared theory. Chapters 3–6 carry the project contributions. Project results are currently documented in their repositories and manuscripts; the thesis research chapters remain placeholders.</div>${D.chapters.map(c=>`<details class="outline" ${c.number<=2?'open':''}><summary><span><span style="color:var(--muted);margin-right:12px;font-size:11px">${String(c.number).padStart(2,'0')}</span>${esc(c.title)}</span></summary><div class="chapter-info"><span>${esc(c.state)}</span><a href="${esc(c.href)}">Open LaTeX source ↗</a>${c.projects.map(id=>`<button class="text-button" data-project="${id}">${esc(P[id].name)} ↗</button>`).join('')}</div><div class="outline-contents">${c.headings.length?outlineRows(c.headings,c.number):`<p class="outline-empty">${c.projects.length?'Scientific content is mapped from the project sources.':'No section headings yet.'}</p>`}</div></details>`).join('')}`}
function evidence(){const values=Object.values(D.evidence).filter(e=>state.sourceFilter==='all'||e.kind===state.sourceFilter);const kinds=[...new Set(Object.values(D.evidence).map(e=>e.kind))].sort();return head('Evidence and source context','Inspect line-numbered excerpts, source locations, and the records they support.',`<select class="filter" id="source-filter" aria-label="Filter source type"><option value="all">All source types</option>${kinds.map(k=>`<option ${state.sourceFilter===k?'selected':''}>${esc(k)}</option>`).join('')}</select>`)+`<p class="evidence-summary">${D.meta.source_count} anchored excerpts · ${D.meta.claim_count} curated claims · Source files carry SHA-256 fingerprints.</p><details class="outline"><summary>Source observations and interpretation</summary><div class="outline-contents">${D.observations.map(o=>`<article class="observation"><h3>${esc(o.title)}</h3><p>${esc(o.text)}</p>${chips(o.sources)}</article>`).join('')}<p class="provenance">${esc(D.meta.narrative_basis)}</p></div></details><div class="source-list">${values.map(e=>`<button class="evidence-row ${state.source===e.id?'selected':''}" data-source="${e.id}">${badge(e.kind)}<h3>${esc(e.label)}</h3><p>${esc(e.path)} · lines ${e.start}–${e.end}</p></button>`).join('')}</div>`}
function projectInspector(p){const records=p[state.detail]||[];const selectedEdge=D.connections.find(e=>e.id===state.edge);return `<div class="inspector-head" style="--accent:${p.color}"><p class="eyebrow">${p.parent?'Chapter 5 · BioFeaturisers workstream':'Chapter '+p.chapter+' · Research project'}</p><h2>${esc(p.name)}</h2><span class="status">${esc(p.status)}</span><p>${esc(p.summary)}</p></div>${selectedEdge?`<section class="connection-inspector">${badge(selectedEdge.type,selectedEdge.basis)}<h3>${esc(selectedEdge.title)}</h3><p>${esc(selectedEdge.text)}</p>${chips(selectedEdge.sources)}</section>`:''}<div class="inspector-body" style="--accent:${p.color}"><div class="question"><p class="eyebrow">Research question</p>${esc(p.question)}</div><dl><div><dt>Inputs</dt><dd>${esc(p.inputs)}</dd></div><div><dt>Outputs</dt><dd>${esc(p.outputs)}</dd></div></dl><div class="detail-tabs" role="tablist" aria-label="Project details">${[['claims','Claims'],['experiments','Experiments'],['modules','Code'],['limits','Limits']].map(([id,label])=>`<button role="tab" data-detail="${id}" aria-selected="${state.detail===id}">${label}</button>`).join('')}</div><section id="detail-records" aria-label="${esc(state.detail)}">${state.detail==='limits'?`<div class="boundary"><h3>Interpretation boundary</h3>${esc(p.boundary)}</div><div class="next"><strong>Next research step</strong>${esc(p.next)}</div>${chips(p.sources)}`:records.map(r=>`<article class="claim" id="record-${r.id}">${badge(r.kind||r.state||(state.detail==='modules'?'Code':'Method'),r.basis)}<h3>${esc(r.title)}</h3><p>${esc(r.text)}</p>${chips(r.sources)}</article>`).join('')}</section>${state.detail==='modules'?p.manuscripts.map(m=>`<details><summary>${esc(m.title)}</summary><p class="provenance"><a href="../${esc(m.path)}">Open manuscript source ↗</a></p>${m.headings.length?outlineRows(m.headings):'<p class="manuscript-heading">This file assembles other LaTeX sections.</p>'}</details>`).join(''):''}<p class="provenance">${esc(p.parent?'Workstream within the BioFeaturisers project.':'Project sources are available from each evidence chip.')}</p></div>`}
function sourceInspector(e){const uniqueUses=[...new Map(e.uses.map(u=>[u.record,u])).values()];return `<div class="inspector-head source-head"><button class="text-button" data-back-project="${state.project}">← ${esc(P[state.project].name)} details</button><p class="eyebrow" style="margin-top:15px">${esc(e.kind)} · Source excerpt</p><h2>${esc(e.label)}</h2><div class="source-meta"><span>${esc(e.path)}</span><span>Lines ${e.start}–${e.end}</span></div></div><div class="inspector-body"><div class="source-actions"><a href="${esc(e.href)}">Open source file ↗</a><button class="text-button" id="copy-source-link">Copy map link</button></div><div class="excerpt">${e.excerpt.split('\n').map((line,i)=>`<div class="excerpt-line"><span class="line-no">${e.start+i}</span><span class="line-text">${esc(line)}</span></div>`).join('')}</div><div class="source-uses"><h3>Used by ${uniqueUses.length} map record${uniqueUses.length===1?'':'s'}</h3>${uniqueUses.map(u=>`<button ${u.view?`data-view="${u.view}"`:`data-project="${u.project}" data-record="${u.record}"`}>${esc(u.title)} ↗</button>`).join('')}</div><p class="provenance">SHA-256<br>${esc(e.sha256)}</p><p class="provenance">This excerpt is embedded in the map. The link opens the local file; line numbers identify the source span at build time. Rebuild to refresh changed sources.</p></div>`}
const index=[];
for(const p of D.projects){index.push({type:'Project',title:p.name,text:p.tagline+' '+p.question,project:p.id,terms:[p.name,p.summary,p.question,...p.tags].join(' ')});for(const list of ['claims','experiments','modules'])for(const r of p[list])index.push({type:list==='claims'?'Claim':list==='experiments'?'Experiment':'Code',title:r.title,text:r.text,project:p.id,record:r.id,detail:list,terms:[p.name,r.title,r.text,...p.tags].join(' ')})}
for(const e of D.connections)index.push({type:'Connection',title:e.title,text:e.text,edge:e.id,terms:[e.title,e.text,P[e.source].name,P[e.target].name].join(' ')});
for(const e of Object.values(D.evidence))index.push({type:e.kind+' source',title:e.label,text:e.path+' · lines '+e.start+'–'+e.end,source:e.id,terms:[e.label,e.path,e.excerpt].join(' ')});
for(const c of D.chapters)for(const h of c.headings)index.push({type:'Thesis heading',title:h.title,text:'Chapter '+c.number+' · '+c.title,chapter:c.number,terms:[c.title,h.title].join(' ')});
function searchResults(){const words=state.query.toLowerCase().trim().split(/\s+/);const hits=index.filter(r=>words.every(word=>r.terms.toLowerCase().includes(word)));return head(`Search results (${hits.length})`,`Matches across projects, claims, experiments, connections, thesis headings, and evidence excerpts.`)+(hits.length?hits.map((r,i)=>`<button class="search-result" data-search-index="${index.indexOf(r)}">${badge(r.type)}<h3>${esc(r.title)}</h3><p>${esc(r.text.length>270?r.text.slice(0,270)+'…':r.text)}</p></button>`).join(''):'<div class="empty">No matching records. Try a project name, method, protein, or source filename.</div>')}
function render(){views.forEach(v=>{$('tab-'+v).setAttribute('aria-selected',String(state.view===v));$('tab-'+v).setAttribute('aria-controls','main-content')});$('clear-search').hidden=!state.query;$('main-content').innerHTML=state.query?searchResults():({journey,projects,connections,thesis,evidence}[state.view])();$('inspector').innerHTML=state.source?sourceInspector(D.evidence[state.source]):projectInspector(P[state.project]);$('inspector').style.setProperty('--accent',state.source?'#227b70':P[state.project].color)}
function hashFor(){return '#'+state.view+'/'+state.project+(state.source?'/source/'+state.source:state.edge?'/connection/'+state.edge:'')}
function navigate(changes,{focusDetails=false}={}){Object.assign(state,changes);state.query='';$('search').value='';const hash=hashFor();if(location.hash!==hash)history.pushState(null,'',hash);render();if(focusDetails&&innerWidth<=800){$('inspector').scrollIntoView({behavior:'auto',block:'start'});$('inspector').setAttribute('tabindex','-1');$('inspector').focus({preventScroll:true})}}
function readHash(){const parts=location.hash.slice(1).split('/');state.view=views.includes(parts[0])?parts[0]:'journey';state.project=P[parts[1]]?parts[1]:'valdx';state.source=parts[2]==='source'&&D.evidence[parts[3]]?parts[3]:null;state.edge=parts[2]==='connection'&&D.connections.some(e=>e.id===parts[3])?parts[3]:null;state.query='';$('search').value='';render()}
document.addEventListener('click',async event=>{const button=event.target.closest('button');if(!button)return;
 if(button.dataset.view){navigate({view:button.dataset.view,source:null,edge:null});return}
 if(button.dataset.source){navigate({source:button.dataset.source,edge:null},{focusDetails:true});return}
 if(button.dataset.project){const record=button.dataset.record;const project=P[button.dataset.project];const edge=D.connections.find(e=>e.id===record);if(edge){navigate({view:'connections',project:edge.target,edge:edge.id,source:null},{focusDetails:true});return}const detail=record?['claims','experiments','modules'].find(k=>project[k].some(r=>r.id===record))||'claims':'claims';navigate({project:project.id,source:null,edge:null,detail},{focusDetails:true});if(record)$('record-'+record)?.scrollIntoView({block:'nearest'});return}
 if(button.dataset.backProject){navigate({source:null,edge:null});return}
 if(button.dataset.detail){state.detail=button.dataset.detail;const position=$('inspector').scrollTop;render();$('inspector').scrollTop=position;return}
 if(button.dataset.edge){const edge=D.connections.find(e=>e.id===button.dataset.edge);navigate({project:edge.target,edge:edge.id,source:null,detail:'claims'},{focusDetails:true});return}
 if(button.dataset.searchIndex){const r=index[Number(button.dataset.searchIndex)];if(r.source)navigate({view:'evidence',source:r.source,edge:null},{focusDetails:true});else if(r.edge){const e=D.connections.find(e=>e.id===r.edge);navigate({view:'connections',project:e.target,edge:e.id,source:null},{focusDetails:true})}else if(r.chapter){navigate({view:'thesis',source:null,edge:null});const element=document.querySelectorAll('.outline')[r.chapter-1];element.open=true;element.scrollIntoView({block:'start'})}else{navigate({view:'projects',project:r.project,detail:r.detail||'claims',source:null,edge:null},{focusDetails:true});if(r.record)$('record-'+r.record)?.scrollIntoView({block:'nearest'})}return}
 if(button.id==='clear-search'){state.query='';$('search').value='';render();$('search').focus();return}
 if(button.id==='copy-source-link'){try{await navigator.clipboard.writeText(location.href);button.textContent='Copied'}catch{button.textContent='Select link below';const field=document.createElement('input');field.value=location.href;field.readOnly=true;field.style.width='100%';button.after(field);field.select()}return}
});
document.addEventListener('change',event=>{if(event.target.id==='connection-filter'){state.connectionFilter=event.target.value;render()}if(event.target.id==='source-filter'){state.sourceFilter=event.target.value;render()}});
$('search').addEventListener('input',()=>{state.query=$('search').value;render()});
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();$('search').focus();$('search').select()}if(event.key==='Escape'&&state.query){state.query='';$('search').value='';render();$('search').focus()}const tab=event.target.closest('.tab');if(tab&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const current=views.indexOf(tab.dataset.view);const next=event.key==='Home'?0:event.key==='End'?views.length-1:(current+(event.key==='ArrowRight'?1:-1)+views.length)%views.length;navigate({view:views[next],source:null,edge:null});$('tab-'+views[next]).focus()}});
document.querySelector('.skip').addEventListener('click',event=>{event.preventDefault();$('main-content').focus();$('main-content').scrollIntoView({block:'start'})});
window.addEventListener('popstate',readHash);window.addEventListener('hashchange',readHash);
$('author').textContent=D.meta.author;$('title').textContent=D.meta.display_title;$('arc').textContent=D.meta.arc;$('formal').textContent=D.meta.title;$('source-count').textContent=D.meta.source_count;$('review-note').textContent=D.meta.review_note;
readHash();
</script>
</body>
</html>
