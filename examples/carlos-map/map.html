<style>
:root{
  color-scheme:light;
  --bg:#f6f5f2; --surface:#ffffff; --surface2:#f0efeb; --ink:#14140f; --ink2:#52514e; --muted:#6a6963; --line:#dcdbd5; --line2:#c9c8c0;
  --link:#1c5cab; --focus:#1c5cab; --shadow:0 1px 2px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.06);
  --worked:#0ca30c; --partial:#fab219; --failed:#d03b3b; --pivot:#2a78d6; --onpartial:#3a2a00;
  --t-front:#8f8e87; --t-background:#2a78d6; --t-method:#eb6834; --t-result:#1baf7a; --t-discussion:#e87ba4; --t-appendix:#6b6a66; --t-figure:#b58a00; --t-table:#4a3aa7;

  --x-ref:#77766f; --x-builds_on:#2a78d6; --x-reuses_method:#eb6834; --x-same_dataset:#1baf7a; --x-answers_limitation:#d03b3b; --x-same_concept:#e87ba4; --x-summarises:#8f8e87; --x-same_content:#8f8e87;
}

  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#121211; --surface:#1c1c1b; --surface2:#262625; --ink:#f2f1ec; --ink2:#c3c2b7; --muted:#a2a199; --line:#34332f; --line2:#47463f;
    --link:#7fb1f0; --focus:#7fb1f0; --shadow:0 1px 2px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.4);
    --onpartial:#2b1f00;
    --t-front:#8f8e87; --t-background:#3987e5; --t-method:#d95926; --t-result:#199e70; --t-discussion:#d55181; --t-appendix:#9b9a92; --t-figure:#c98500; --t-table:#9085e9;
    --e-method:#a592f0; --e-software:#5fb3b3; --e-dataset:#d0974a; --e-term:#c08ac0;
    --x-ref:#9a9990; --x-builds_on:#3987e5; --x-reuses_method:#d95926; --x-same_dataset:#199e70; --x-answers_limitation:#e66767; --x-same_concept:#d55181; --x-summarises:#8f8e87; --x-same_content:#8f8e87;
    --pivot:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211; --surface:#1c1c1b; --surface2:#262625; --ink:#f2f1ec; --ink2:#c3c2b7; --muted:#a2a199; --line:#34332f; --line2:#47463f;
  --link:#7fb1f0; --focus:#7fb1f0; --shadow:0 1px 2px rgba(0,0,0,.5),0 4px 14px rgba(0,0,0,.4);
  --onpartial:#2b1f00;
  --t-front:#8f8e87; --t-background:#3987e5; --t-method:#d95926; --t-result:#199e70; --t-discussion:#d55181; --t-appendix:#9b9a92; --t-figure:#c98500; --t-table:#9085e9;
  --e-method:#a592f0; --e-software:#5fb3b3; --e-dataset:#d0974a; --e-term:#c08ac0;
  --x-ref:#9a9990; --x-builds_on:#3987e5; --x-reuses_method:#d95926; --x-same_dataset:#199e70; --x-answers_limitation:#e66767; --x-same_concept:#d55181; --x-summarises:#8f8e87; --x-same_content:#8f8e87;
  --pivot:#3987e5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
header{background:var(--bg)}
.tabbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;max-width:1500px;margin:0 auto}
.brand{flex:1 1 280px;min-width:0}
.brand h1{font-size:17px;line-height:1.25;margin:0;font-weight:650}
.brand p{margin:2px 0 0;color:var(--ink2);font-size:12.5px}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);min-height:38px}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:50;padding:4px}
.results[hidden]{display:none}
.results button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px}
.results button[aria-selected="true"],.results button:hover{background:var(--surface2)}
.results .kind{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);min-width:56px}
.results .rt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.results .none{padding:8px;color:var(--muted)}
.iconbtn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;min-height:38px;padding:0 12px}
.tabs{display:flex;gap:4px;padding:0 16px;max-width:1500px;margin:0 auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;font-weight:600;color:var(--ink2);min-height:40px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--link)}

/* ---------- layout ---------- */
main{max-width:1500px;margin:0 auto;padding:14px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
@media (max-width:1050px){main{grid-template-columns:minmax(0,1fr)}}
.view{min-width:0}
.view[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.panel{position:sticky;top:56px;max-height:calc(100vh - 72px);overflow:auto;padding:14px 16px}
@media (max-width:1050px){.panel{position:static;max-height:none}}
.panel h2{font-size:17px;margin:0 0 4px;line-height:1.3}
.panel h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 4px;font-weight:650}
.panel p{margin:4px 0}
.panel ul{margin:4px 0;padding-left:18px}
.panel li{margin:3px 0}
.hint{color:var(--muted);font-size:13px}

/* ---------- common bits ---------- */
.pg{display:inline-block;font:600 11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);border-radius:5px;padding:0 6px;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:999px;padding:1px 9px;margin:2px 4px 2px 0;min-height:24px;text-decoration:none}
button.chip:hover,a.chip:hover{background:var(--surface2)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.basis{font-size:11px;border-radius:4px;padding:0 5px;border:1px solid var(--line2);color:var(--ink2)}
.basis.inferred{border-style:dashed}
.badge{font-size:11.5px;font-weight:650;border-radius:5px;padding:0 6px;display:inline-flex;gap:4px;align-items:center}
.quote{border-left:3px solid var(--line2);margin:6px 0;padding:2px 10px;color:var(--ink2);font-style:italic}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:5px 11px;min-height:32px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button + button{border-left:1px solid var(--line2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.toolbar label{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;min-height:28px}
.toolbar .grp{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.toolbar .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink2);padding:8px 14px;border-top:1px solid var(--line)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:0;border-top:2.5px solid currentColor;display:inline-block}
.sw.dash{border-top-style:dashed}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 10px;font-size:12.5px;max-width:320px;box-shadow:var(--shadow);line-height:1.4}
#tip[hidden]{display:none}
#tip .pg{background:transparent;border-color:currentColor;color:inherit}

/* ---------- journey ---------- */
.jhead{padding:12px 16px;border-bottom:1px solid var(--line)}
.jhead p{margin:4px 0 0;max-width:80ch}
.jhead .arc{color:var(--ink2);font-size:14px}
.story-scroll{overflow-x:auto;overflow-y:hidden;padding:0 4px 8px}
.story{position:relative;display:flex;gap:14px;padding:14px 14px 16px;min-width:max-content}
.act{display:flex;flex-direction:column;gap:8px}
.act>h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:2px solid var(--line2);padding-bottom:4px}
.act .row{display:flex;gap:0}
.stage{position:relative;width:172px;flex:none;background:none;border:0;text-align:left;padding:0 8px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;border-radius:10px;transition:opacity .15s}
.stage .track{position:relative;height:48px;width:100%;display:flex;align-items:center}
.stage .track::before{content:"";position:absolute;left:-8px;right:-8px;top:50%;border-top:3px solid var(--line2)}
.stage:first-child .track::before{left:20px}
.act:first-child .stage:first-child .track::before{left:20px}
.stage .track svg{position:relative;flex:none}
.stage .num{font:600 11px ui-monospace,Menlo,monospace;color:var(--muted)}
.stage .ttl{font-weight:650;font-size:13.5px;line-height:1.3}
.stage .out{font-size:12px;font-weight:650}
.stage .meta{font-size:11.5px;color:var(--muted)}
.stage:hover{background:var(--surface2)}
.stage.is-sel{background:var(--surface2);box-shadow:inset 0 0 0 2px var(--link)}
.dim .stage:not(.is-rel):not(.is-sel){opacity:.38}
.arcs{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.arcs path{fill:none;stroke:var(--x-answers_limitation);stroke-width:1.8;stroke-dasharray:5 4}
.arcs text{fill:var(--ink2);font-size:11px}
.jlegend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:8px 16px;font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line)}
.jlegend span{display:inline-flex;gap:6px;align-items:center}
@media (max-width:760px){
  .story-scroll{overflow:visible}
  .story{flex-direction:column;min-width:0;padding:12px 4px;gap:10px}
  .act .row{flex-direction:column}
  .stage{width:100%;flex-direction:row;align-items:flex-start;gap:12px;padding:8px 6px}
  .stage .track{width:44px;height:auto;flex:none;align-self:stretch;align-items:flex-start}
  .stage .track::before{left:50%;right:auto;top:0;bottom:-10px;border-top:0;border-left:3px solid var(--line2)}
  .stage .body{flex:1;min-width:0}
  .arcs{display:none}
}
.stage .body{display:flex;flex-direction:column;gap:3px}

/* ---------- structure ---------- */
.strip{display:flex;gap:2px;padding:12px 14px 4px;height:62px;align-items:stretch}
.strip button{border:0;border-radius:4px;min-width:6px;padding:0;color:#fff;font-size:11px;font-weight:650;overflow:hidden;position:relative;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.strip button.is-rel{outline:3px solid var(--ink);outline-offset:1px;z-index:2}
.strip button span{position:absolute;left:4px;top:3px}
.striplbl{padding:0 14px 8px;font-size:12px;color:var(--muted)}
.tree{padding:6px 8px 12px}
.trow{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:7px;min-height:32px;cursor:pointer}
.trow:hover{background:var(--surface2)}
.trow.is-rel{background:color-mix(in srgb,var(--link) 12%,transparent)}
.trow.is-sel{background:color-mix(in srgb,var(--link) 24%,transparent);box-shadow:inset 3px 0 0 var(--link)}
.trow .caret{width:22px;height:22px;flex:none;border:0;background:none;color:var(--ink2);padding:0;border-radius:4px}
.trow .caret.leaf{visibility:hidden}
.trow .num{font:600 12px ui-monospace,Menlo,monospace;color:var(--muted);min-width:34px;flex:none}
.trow .tt{flex:1 1 40%;min-width:0;font-size:14px;overflow-wrap:anywhere}
.trow.l0 .tt{font-weight:650}
.trow .bar{flex:0 1 150px;width:150px;height:10px;background:var(--surface2);border-radius:5px;overflow:hidden;position:relative}
.trow .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.trow .tm{flex:none;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.trow .cnt{font-size:11.5px;color:var(--ink2);white-space:nowrap}
@media (max-width:640px){.trow{flex-wrap:wrap}.trow .bar{flex:1 1 90px;width:auto}.trow .tt{flex-basis:60%}}
.tplate{display:flex;flex-wrap:wrap;gap:2px 0;padding:0;margin:4px 0;list-style:none}
.tplate li{font-size:12px;background:var(--surface2);border:1px solid var(--line);padding:2px 10px 2px 14px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%,8px 50%);margin:0 -4px 0 0}

/* ---------- links ---------- */
#graph{width:100%;height:min(74vh,720px);min-height:420px;display:block;touch-action:none}
.node text{font-size:11.5px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;pointer-events:none}
.node{cursor:pointer}
.node:focus-visible circle,.node:focus-visible path,.node:focus-visible rect{stroke:var(--focus);stroke-width:3}
.node .shape{stroke:var(--surface);stroke-width:2}
.node.is-sel .shape{stroke:var(--ink);stroke-width:3.5}
.node.is-rel .shape{stroke:var(--ink);stroke-width:2}
.gdim .node:not(.is-rel):not(.is-sel){opacity:.28}
.gdim .link:not(.is-rel){opacity:.1}
.link{fill:none;cursor:pointer}
.link.dash{stroke-dasharray:6 5}
.link.hit{stroke:transparent;stroke-width:12;stroke-dasharray:none}
.link.is-rel{opacity:1}
.edgelist{padding:8px 14px 12px}
.edgelist summary{cursor:pointer;font-weight:600;min-height:28px}
.edgelist ul{margin:6px 0 0;padding-left:18px;max-height:280px;overflow:auto;font-size:13px}
.edgelist li{margin:2px 0}
.nolib{padding:20px;color:var(--muted)}

#jump{position:fixed;right:14px;bottom:14px;z-index:40;box-shadow:var(--shadow);background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
#jump[hidden]{display:none}
footer{max-width:1500px;margin:0 auto;padding:0 16px 40px;color:var(--ink2);font-size:13px}
footer details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin-bottom:8px}
footer summary{cursor:pointer;font-weight:600}
footer ul{padding-left:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script type="application/json" id="thesis-data">{"meta":{"title":"Developments in Machine Learning and Bonding Indicators for the Quantum Chemical Topology Force Field","author":"Carlos Outeiral Rubiera","degree":"Master of Philosophy (MPhil), Faculty of Science and Engineering, University of Manchester","year":2018,"supervisor":"P. L. A. Popelier (named in Acknowledgements, p. 16)","word_count_stated":42894,"word_count_source_page":6,"note":"This is an MPhil thesis (one-year research degree, 2017-2018, p. 20), not a PhD.","generated_from":"carlos-thesis.pdf (266 PDF pages)","page_map":{"rule":"printed page = PDF page index - 1","verified_on":244,"of":266,"exceptions":[{"pdf":[1,2],"note":"cover and ProQuest notice carry no printed number (treated as p. 0 and p. 1)"},{"pdf":[188,201],"note":"embedded journal article: thesis page number not printed; the journal's own pagination 5497-5529 is shown instead. Thesis-counted page = PDF index - 1 (e.g. PDF 189 = p. 188 = Chem. Sci. p. 5517)"},{"pdf":[215],"note":"OCR misread of the page number; offset is still 1"}],"numbering":"Front matter is arabic-numbered from the cover (no roman numerals).","ocr":"Scanned PDF: pdftotext returned no text. OCR with tesseract 5 (eng, 220 dpi) page by page; ocrmypdf was not available."},"convention":"All page numbers are printed page numbers (PDF index - 1)."},"journey":{"arc":"The thesis records a one-year MPhil in the Popelier group (2017-2018) whose open brief was to 'extend the applicability of the FFLUX force field' (p. 21). FFLUX replaces fixed-form valence terms with kriging models of quantum atoms and uses high-order multipoles for electrostatics, but after a decade it had only optimised a single water molecule and capped glycine (p. 86). The author first audits FFLUX and reports three negative results: no intermolecular polarisation, 'extrapolation collapse' outside the training set, and the curse of dimensionality (Ch. 3). Two methodological developments follow. The first began as a search for a cheap exchange term to model peptide bonds, then pivoted into a study of the delocalization index as a bond-order indicator, benchmarked on ~200 molecules and published in Chemical Science (Ch. 4). The second, symmetry-adapted kriging, builds permutational symmetry into the models with a group-theoretic kernel and a pivot heuristic, implemented in DL_FFLUX and tested on four small molecules (Ch. 5). The polarisation problem is left open. Order of stages follows the thesis narrative; the author says the path 'might perhaps look sinuous' (p. 21) and gives no dated chronology, so actual order of work is not established.","contribution":[{"text":"Critical appraisal of FFLUX with three simple numerical tests: neglected intermolecular polarisation, extrapolation collapse, and the curse of dimensionality.","nodes":["3.4"],"pages":[100,114],"basis":"stated"},{"text":"Delocalization index shown to be a first-order approximation to the exchange-correlation energy for an arbitrary wavefunction, benchmarked (Müller approximation), surveyed over ~200 molecules and applied to exotic bonding; published in Chemical Science 2018.","nodes":["ch4","A.1"],"pages":[115,186],"basis":"stated"},{"text":"Symmetry-adapted kriging: group-theoretic kernel, pivot heuristic, implementation in DL_POLY FFLUX, tests on four small molecules.","nodes":["ch5"],"pages":[145,181],"basis":"stated"},{"text":"Written derivation of FFLUX atomic forces and a description of the training pipeline (numerical verification cited from earlier work).","nodes":["3.2","3.3"],"pages":[93,100],"basis":"stated"}],"stages":[{"id":"j1","title":"Orientation: the force-field problem and the FFLUX brief","question":"Why do biomolecular force fields still fail, and how could the group's machine-learned FFLUX force field be extended?","approach":"Argues force fields, not sampling, limit simulation (p. 19-20); reviews MD, intermolecular forces, polarisable force fields, Quantum Chemical Topology, Gaussian process regression and FFLUX history (Ch. 2).","outcome":"worked","outcome_note":"Background stage: sets scope and tools; no experiment.","why_next":"FFLUX had reached only single-water and capped-glycine optimisation after a decade (p. 86), so the author asks what the main challenges are before scaling up (p. 87).","chapters":["ch1","ch2"],"evidence":[{"node":"ch1","pages":[19,21]},{"node":"ch2","pages":[22,85]},{"node":"ch3","pages":[86,87]}],"basis":"stated","confidence":"high"},{"id":"j2","title":"Formalise FFLUX: architecture, forces, training pipeline","question":"What exactly is FFLUX's potential, how are atomic forces obtained, and how are the kriging models trained?","approach":"Writes E_FFLUX = E_IQA + E_electrostatic + E_dispersion; defines atomic-local-frame features; derives forces by chain rule through the rotation matrix and the multipole interaction tensors; documents the GAIA pipeline (TYCHE, Gaussian 09, AIMAll, NORMART, FEREBUS, DL_FFLUX).","outcome":"worked","outcome_note":"Presents and derives existing group machinery; numerical verification of the force formulae is referred to ref. [231] (p. 98).","why_next":"With the formulation written down, the author tests it against three physical and mathematical questions (3.4).","chapters":["3.1","3.2","3.3","appC"],"evidence":[{"node":"3.1","pages":[87,93]},{"node":"3.2","pages":[93,98]},{"node":"3.3","pages":[98,100]},{"node":"appC","pages":[221,231],"what":"derivation of the multipolar electrostatics used in 3.1.1"}],"basis":"stated","confidence":"high"},{"id":"j3","title":"Test 1: is intermolecular polarisation negligible?","question":"Can FFLUX's geometry-only multipoles stand in for polarised electrostatics in a condensed environment?","approach":"Five snapshots of a 5-water cluster (BP86/Def2SVP BOMD at 600 K, RI-MP2/cc-pVTZ optimisation); compares electrostatic energy from in-vacuo monomer multipoles with energy from cluster multipoles, up to quadrupole, with AIMAll.","outcome":"failed","outcome_note":"Negative result: ~400 kcal/mol electrostatic error, cluster charges shift 0.10 +/- 0.05 e, and conformer ordering is wrong (p. 103). Not fixed; self-consistent polarisation is suggested as future work (p. 104).","why_next":"Left as an open conceptual limit: FFLUX is 'multipolar' rather than polarisable. Neither Ch. 4 nor Ch. 5 addresses it, and Ch. 6 does not return to it.","chapters":["3.4.1"],"evidence":[{"node":"3.4.1","pages":[101,104],"what":"Table 3.1"}],"basis":"stated","confidence":"high"},{"id":"j4","title":"Test 2: what happens outside the training set?","question":"How does a kriging potential behave when a simulation leaves the region it was trained on?","approach":"Mathematical argument that the correlation vector goes to zero and the prediction tends to the process mean; single-water model (500 TYCHE points, B3LYP/aug-cc-pVTZ); stretched-bond dissociation curve; Metropolis-Hastings Monte Carlo of 2,500 steps.","outcome":"failed","outcome_note":"Negative result ('extrapolation collapse'): potential goes flat beyond the training range and forces vanish; MC energy stalls at -76.4166 hartree after ~1,000 steps (Fig. 3.5). Two remedies considered and set aside (pp. 108-109).","why_next":"No simple fix exists, which makes models that cover more of configuration space cheaply attractive; Ch. 5 cites this section as motivation (p. 148).","chapters":["3.4.2"],"evidence":[{"node":"3.4.2","pages":[104,109],"what":"Figs 3.4-3.6"}],"basis":"stated","confidence":"high"},{"id":"j5","title":"Test 3: does the model scale to a flexible molecule?","question":"Do published capped-glycine kriging models give sensible energies on geometries that a finite-temperature simulation would visit?","approach":"200 RDKit conformers, MMFF94 relaxation and RMSD pruning, 10 lowest kept; B3LYP/apc-1 optimisation plus 200 fs BOMD at 600 K (ORCA) gives 2,000 test geometries; evaluates the published ~0.5 GB model.","outcome":"failed","outcome_note":"Negative result: ~600 kcal/mol mean error, bimodal prediction distribution, minima not ranked (Fig. 3.8). Author blames a 51-dimensional space sampled by about a thousand points and criticises same-method test sets.","why_next":"Calls for fewer training points and representative test sets (p. 113). Ch. 4 also avoids a two-monomer exchange model because of this problem (p. 116), and Ch. 6 says Ch. 5 was motivated by it (p. 183).","chapters":["3.4.3","3.5"],"evidence":[{"node":"3.4.3","pages":[109,113],"what":"Fig. 3.8"},{"node":"3.5","pages":[113,114]}],"basis":"stated","confidence":"high"},{"id":"j6","title":"Pivot: from an exchange term for the peptide bond to the delocalization index","question":"How can FFLUX represent covalent (exchange) interaction between monomers, for example the peptide bond?","approach":"Rejects a harmonic bond (undoes FFLUX's purpose) and a kriged V_xc (six-dimensional integrals and curse of dimensionality). Proposes the delocalization index as a first-order approximation to V_xc using only 3-D integrals, and proves this for arbitrary wavefunctions; adopts Müller's approximation for correlated 2-RDMs.","outcome":"pivot","outcome_note":"'Soon acquired a dimension of its own' as a bond-order study (p. 116). Suitability of DI as an FFLUX exchange potential is explicitly left as future work (p. 117).","why_next":"Before using DI anywhere, the author checks the approximation used to compute it (j7) and how DI behaves in ordinary chemistry (j8).","chapters":["ch4","4.1"],"evidence":[{"node":"ch4","pages":[115,118]},{"node":"4.1","pages":[118,126]}],"basis":"stated","confidence":"high"},{"id":"j7","title":"Check Müller's approximation against the full 2-RDM","question":"Is the Müller approximation accurate enough to compute DIs for correlated wavefunctions?","approach":"21 small molecules at CCSD/6-311++G(2d,2p): full 2-RDM from pySCF plus PROMOLDEN versus AIMAll's Müller approximation.","outcome":"partial","outcome_note":"Most directly bonded pairs within 5%, but N2 (11.4%), HCN C-N (10.1%) and F2 (34.1%) worse; non-bonded DIs underestimated 20-70% except H-bonds, which are overestimated (Table 4.1). Full 2-RDM took ~2 weeks vs ~10 h.","why_next":"Accepted as a qualitative tool: HF values serve as the baseline and CCSD/Müller as a lower bound for weak interactions (p. 129).","chapters":["4.2.2","4.1.3"],"evidence":[{"node":"4.2.2","pages":[127,129],"what":"Table 4.1"}],"basis":"stated","confidence":"high"},{"id":"j8","title":"Survey ~200 molecules: does DI behave like a bond order?","question":"Do delocalization indices reproduce Lewis bond orders and the subtler effects of practical chemistry?","approach":"~200 organic and inorganic molecules (28 inorganic) at HF and CCSD/6-311++G(2d,2p) with Gaussian 09 and AIMAll; 14,756 HF DI entries; plateau analysis, k-means, HF vs CCSD comparison, homologous series and resonance examples.","outcome":"worked","outcome_note":"DIs cluster near single/aromatic/double values (C-C ~1.0/1.4/1.8), HF is closest to Lewis, correlation lowers bonded DIs and raises weak ones, inductive and resonance effects are recovered; polar bonds fall below formal order.","why_next":"Having tested only well-known patterns, the author applies DI to disputed exotic bonding (j9).","chapters":["4.2.1","4.2.3","4.2.4","4.2.5"],"evidence":[{"node":"4.2.1","pages":[126,127]},{"node":"4.2.3","pages":[129,131]},{"node":"4.2.4","pages":[131,134],"what":"Figs 4.1-4.2"},{"node":"4.2.5","pages":[134,137],"what":"Figs 4.3-4.4"}],"basis":"stated","confidence":"high"},{"id":"j9","title":"Apply DI to exotic bonding: N8, planar carbon, an iron complex","question":"Can delocalization indices clarify bonding in disputed or unusual molecules?","approach":"N8 (EEE and EZE isomers), dilithium cyclopropane (planar tetracoordinate carbon), and (eta4-C4H6)Fe(CO)3 (B3LYP geometry, HF and CCSD single points).","outcome":"worked","outcome_note":"N8: proposes a pentavalent-nitrogen Lewis structure that disagrees with the discoverers' ionic NBO picture; Li2-cyclopropane: no revision needed; Fe complex: total DI ~1.7 consistent with a double bond. Metal complexes otherwise avoided because Müller cannot handle static correlation (p. 141).","why_next":"Closes the DI thread (published as Chem. Sci. 2018, App. A). The thesis then turns to the sampling problem raised in 3.4 (Ch. 5); Ch. 6 states that link (p. 183).","chapters":["4.3.1","4.3.2","4.3.3","4.4","A.1"],"evidence":[{"node":"4.3.1","pages":[137,140],"what":"Figs 4.5-4.6"},{"node":"4.3.2","pages":[140,141]},{"node":"4.3.3","pages":[141,143]},{"node":"A.1","pages":[186,186]}],"basis":"stated","confidence":"high"},{"id":"j10","title":"Make kriging respect permutational symmetry","question":"How can a kriging potential recognise that relabelled identical atoms are the same molecule?","approach":"Reviews symmetry-adapted features and models (5.1); uses finite group theory and faithful representations; builds a kernel summed over group images of each training point; proves invariance by the rearrangement theorem with an isotropic kernel and isometric representations.","outcome":"partial","outcome_note":"Invariance is proven, but in pure form it costs N kernel evaluations per training point, O(NM) (p. 162), and needs FEREBUS changes because symmetry-related weights are shared.","why_next":"A heuristic is needed to avoid the N-fold cost (j11).","chapters":["ch5","5.1","5.2"],"evidence":[{"node":"ch5","pages":[145,149],"what":"Fig. 5.1"},{"node":"5.1","pages":[149,154]},{"node":"5.2","pages":[154,162]}],"basis":"stated","confidence":"high"},{"id":"j11","title":"Cut the cost: pivot heuristic and DL_FFLUX implementation","question":"Can symmetry be built in without paying for N kernel evaluations?","approach":"Splits configuration space into symmetry-equivalent regions; chooses a pivot (usually a PES minimum); applies each representation matrix to the query geometry and keeps the image with minimum Kabsch RMSD to the pivot. Implemented as fflux_symmetry_transformation in DL_POLY FFLUX, leaving feature and force code untouched (App. B).","outcome":"worked","outcome_note":"Cost drops to O(M). The RMSD metric is a heuristic; a metric from first principles is left to future work (p. 165).","why_next":"Tested on water, ammonia, methanol and acetaldehyde (j12).","chapters":["5.3","appB"],"evidence":[{"node":"5.3.1","pages":[162,165],"what":"Figs 5.2-5.3"},{"node":"5.3.2","pages":[165,167],"what":"Fig. 5.4"},{"node":"appB","pages":[211,220]}],"basis":"stated","confidence":"high"},{"id":"j12","title":"Test on water, ammonia, methanol and acetaldehyde","question":"Does symmetry-adapted kriging give consistent curves and optimisations when trained on one symmetry region only?","approach":"Water and NH3 dissociation curves (100 MP2/cc-pVTZ points, MolecularSAGPR on scikit-learn); methanol (600 points) and acetaldehyde (900 points) in DL_FFLUX, TYCHE at 3000 K from one seed; 6,000 test geometries (1,000 x 6 permutations) minimised for 1,500 steps.","outcome":"worked","outcome_note":"All symmetry-adapted runs reach the expected minimum (methanol mean RMSD 0.002 +/- 0.004 A); baseline runs mostly end in wrong structures. One trajectory shows a boundary effect (p. 173). Only one P(3) symmetry centre is tested.","why_next":"Conclusions (Ch. 6): the method is ready to be deployed and will go into the next FFLUX version (p. 181).","chapters":["5.4","5.5"],"evidence":[{"node":"5.4.1","pages":[167,171],"what":"Figs 5.5-5.6"},{"node":"5.4.2","pages":[171,180],"what":"Figs 5.7-5.13"},{"node":"5.5","pages":[180,181]}],"basis":"stated","confidence":"high"},{"id":"j13","title":"Synthesis: two methodological contributions","question":"What does the work amount to?","approach":"Restates the DI work (cheap exchange proxy, Müller validation, bond-order clustering, exotic cases) and symmetry-adapted kriging (group-theoretic kernel plus pivot heuristic).","outcome":"worked","outcome_note":"Polarisation and extrapolation collapse from Ch. 3 are not revisited in Ch. 6; Ch. 1 promises 'future lines of work' (p. 21) but Ch. 6 has no such list.","why_next":"End of the thesis. Author hands over DI as a bond-order indicator and SAGPR as a tool ready to deploy (p. 185).","chapters":["ch6"],"evidence":[{"node":"ch6","pages":[182,185]}],"basis":"stated","confidence":"high"}],"outcome_values":["worked","partial","failed","pivot"]},"structure":{"nodes":[{"id":"front","number":"","title":"Front matter","parent":null,"children":["front.title","front.proquest","front.contents","front.abstract","front.declaration","front.copyright","front.epigraph","front.ack","front.acronyms"],"level":0,"type":"front","type_note":null,"template":null,"pages":[0,18],"source_pages":[0,18],"journal_pages":null,"approx_words":2061,"approx_words_own":0,"n_figures":0,"n_tables":0,"figures":[],"tables":[],"n_figures_own":0,"n_tables_own":0,"publication":null,"summary":"Title, notices, contents, abstract, declaration, acknowledgements and acronym list.","summary_basis":"paraphrase of stated content","quote":null,"stages":[],"claims":[],"basis":"stated","confidence":"high","chapter":"front"},{"id":"front.title","number":"","title":"Title page","parent":"front","children":[],"level":1,"type":"front","type_note":null,"template":null,"pages":[0,0],"source_pages":[0,0],"journal_pages":null,"approx_words":43,"approx_words_own":43,"n_figures":0,"n_tables":0,"figures":[],"tables":[],"n_figures_own":0,"n_tables_own":0,"publication":null,"summary":"Title page: MPhil thesis, University of Manchester, 2018.","summary_basis":"paraphrase of stated content","quote":null,"stages":[],"claims":[],"basis":"stated","confidence":"high","chapter":"front"},{"id":"front.proquest","number":"","title":"ProQuest notice","parent":"front","children":[],"level":1,"type":"front","type_note":null,"template":null,"pages":[1,1],"source_pages":[1,1],"journal_pages":null,"approx_words":111,"approx_words_own":111,"n_figures":0,"n_tables":0,"figures":[],"tables":[],"n_figures_own":0,"n_tables_own":0," coordinate carbon","description":"Studied in 4.3.2.","chapters":["ch4"],"sections":["4.3.2","4.4"],"n_mentions":4,"source_pages":[140,144],"n_pages":2,"basis":"stated","confidence":"high"},{"id":"k.fe","type":"term","name":"(eta4-C4H6)Fe(CO)3 complex","description":"Studied in 4.3.3.","chapters":["ch4"],"sections":["4.3.3","4.4"],"n_mentions":7,"source_pages":[141,142,144],"n_pages":3,"basis":"stated","confidence":"high"}],"claims":[{"id":"c01","text":"Very long (>100 microsecond) simulations on special-purpose hardware showed proteins drifting from native structures; the cited authors read this as force fields, not sampling, being limiting.","node":"ch1","figure":null,"stage":"j1","source_pages":[19,20],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c02","text":"The thesis records the author's 2017-2018 MPhil year in the Popelier group under an open brief.","node":"ch1","figure":null,"stage":"j1","source_pages":[20,21],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c03","text":"FFLUX (formerly QCTFF) grew from rigid-molecule multipolar simulations of HF and water to kriging-predicted conformation-dependent multipoles, after kriging outperformed neural networks in group comparisons.","node":"2.6.1","figure":null,"stage":"j1","source_pages":[84,85],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c04","text":"By 2018 FFLUX's maximum demonstrations were optimisations of one water molecule and of capped glycine.","node":"ch3","figure":null,"stage":"j1","source_pages":[86],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c05","text":"Abstract: FFLUX replaces fixed-form valence potentials with non-parametric regression and uses high-order multipolar electrostatics, aiming at ligand-receptor energetics.","node":"front.abstract","figure":null,"stage":"j1","source_pages":[11],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c06","text":"E_FFLUX = E_IQA + E_electrostatic + E_dispersion: E_IQA is a kriged atomic energy, dispersion is Lennard-Jones, electrostatics use kriged multipoles up to hexadecapole.","node":"3.1.1","figure":"Fig. 3.1","stage":"j2","source_pages":[87,89],"basis":"stated","confidence":"high","figure_ids":["fig.3.1"]},{"id":"c07","text":"FFLUX assumes charge transfer can be modelled by geometry changes alone.","node":"3.1.1","figure":null,"stage":"j2","source_pages":[89],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c08","text":"Features live in an Atomic Local Frame, removing six translational and rotational degrees of freedom; the frame is set by the heaviest and second-heaviest bonded neighbours (CIP rules for ties).","node":"3.1.2","figure":"Fig. 3.2","stage":"j2","source_pages":[90,91],"basis":"stated","confidence":"high","figure_ids":["fig.3.2"]},{"id":"c09","text":"Atomic forces follow from the chain rule through the ALF rotation matrix (internal forces) and through derivatives of the multipole interaction tensors (electrostatic forces); numerical checks are cited from ref. [231].","node":"3.2","figure":null,"stage":"j2","source_pages":[93,98],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c10","text":"Training runs through GAIA: TYCHE geometries, Gaussian 09, AIMAll integration, NORMART rotation to the ALF, FEREBUS training, then DL_FFLUX.","node":"3.3","figure":"Fig. 3.3","stage":"j2","source_pages":[98,100],"basis":"stated","confidence":"high","figure_ids":["fig.3.3"]},{"id":"c11","text":"In FFLUX the charge distribution depends only on molecular geometry, so polarisation is intramolecular only; two same-geometry molecules in different environments get identical multipoles.","node":"3.4.1","figure":null,"stage":"j3","source_pages":[101],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c12","text":"In five water-cluster conformers, using in-vacuo rather than cluster multipoles gave an electrostatic error of about 400 kcal/mol, and cluster charges shifted by 0.10 +/- 0.05 e.","node":"3.4.1","figure":"Table 3.1","stage":"j3","source_pages":[103],"basis":"stated","confidence":"high","figure_ids":["tab.3.1"]},{"id":"c13","text":"Unpolarised electrostatics cannot rank two conformers: the difference is ~8 kcal/mol with each treatment but of opposite sign (~16 kcal/mol in total); the conclusion rounds this to 'about 20' (p. 114).","node":"3.4.1","figure":"Table 3.1","stage":"j3","source_pages":[103,114],"basis":"stated","confidence":"medium","figure_ids":["tab.3.1"]},{"id":"c14","text":"As features leave the training range the GP prediction tends to the process mean, so the potential is flat and forces are zero ('extrapolation collapse').","node":"3.4.2","figure":"Fig. 3.4","stage":"j4","source_pages":[105,106],"basis":"stated","confidence":"high","figure_ids":["fig.3.4"]},{"id":"c15","text":"In a single-water Metropolis-Hastings run, the energy sticks at -76.4166 hartree after ~1,000 of 2,500 steps and the molecule distorts unphysically.","node":"3.4.2","figure":"Fig. 3.5-3.6","stage":"j4","source_pages":[107,108],"basis":"stated","confidence":"high","figure_ids":["fig.3.5","fig.3.6"]},{"id":"c16","text":"Two remedies are set aside: a feature-dependent mean (classical bond potential) cancels the non-parametric benefit, and dense sampling is costly and often impossible via the curse of dimensionality.","node":"3.4.2","figure":null,"stage":"j4","source_pages":[108,109],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c17","text":"A published capped-glycine model (~0.5 GB) tested on 2,000 B3LYP/apc-1 BOMD geometries gives a ~600 kcal/mol mean error and does not rank minima.","node":"3.4.3","figure":"Fig. 3.8","stage":"j5","source_pages":[111,112],"basis":"stated","confidence":"high","figure_ids":["fig.3.8"]},{"id":"c18","text":"The 51-dimensional feature space is extremely sparse for a training set of about a thousand examples.","node":"3.4.3","figure":null,"stage":"j5","source_pages":[112],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c19","text":"Earlier assessments built test sets by the same method as training sets (selection bias), and published simulations show optimisation to minima but not the energetics along trajectories.","node":"3.4.3","figure":null,"stage":"j5","source_pages":[112,113],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c20","text":"Three open challenges: neglect of intermolecular polarisation, extrapolation collapse and the curse of dimensionality.","node":"3.5","figure":null,"stage":"j5","source_pages":[113,114],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c21","text":"In current FFLUX monomers interact only through electrostatics and dispersion, so covalent exchange (e.g. the peptide bond) is missing.","node":"ch4","figure":null,"stage":"j6","source_pages":[115,116],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c22","text":"Kriging V_xc directly needs six-dimensional integrals over irregular boundaries and models of two monomers' coordinates (curse of dimensionality); a harmonic potential would undo FFLUX's aims; so the DI is proposed as a cheaper proxy.","node":"ch4","figure":null,"stage":"j6","source_pages":[116],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c23","text":"Integrating the exchange-correlation pair density gives N = sum of localization indices plus sum of delocalization indices, splitting an atom's electron pairs into localized and delocalized sets.","node":"4.1.1","figure":"Eq. 4.8","stage":"j6","source_pages":[119,120],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c24","text":"The DI is a first-order (charge-charge-like) approximation to V_xc for an arbitrary wavefunction and needs 3-D rather than 6-D integrals.","node":"4.1.2","figure":null,"stage":"j6","source_pages":[121,123],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c25","text":"Müller's approximation estimates the correlated 2-RDM from the 1-RDM; it violates the Pauli principle in general, and p = 0 minimises the violation.","node":"4.1.3","figure":null,"stage":"j6","source_pages":[124,125],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c26","text":"On 21 small molecules, most directly bonded DIs from CCSD/Müller are within 5% of full-2-RDM CCSD; N2 (11.4%), HCN C-N (10.1%) and F2 (34.1%) are worse; non-bonded DIs are underestimated 20-70% except hydrogen bonds, which are overestimated.","node":"4.2.2","figure":"Table 4.1","stage":"j7","source_pages":[127,129],"basis":"stated","confidence":"high","figure_ids":["tab.4.1"]},{"id":"c27","text":"The full CCSD 2-RDM needed ~2 weeks on a 12-CPU node versus ~10 h on 4 cores for AIMAll with Müller.","node":"4.2.2","figure":null,"stage":"j7","source_pages":[127],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c28","text":"HF DIs recover Lewis bond orders (H2 1.000, N2 ~3.04, O2 2.27); CCSD/Müller lowers bonded DIs (H2 0.844, N2 2.310, O2 1.615) and raises weak ones (Ne2 0.005 to 0.009, Ar2 0.002 to 0.015).","node":"4.2.3","figure":null,"stage":"j8","source_pages":[129,130],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c29","text":"HF and CCSD/Müller DIs correlate strongly (Pearson 0.938 over 1,666 bonds).","node":"4.2.3","figure":null,"stage":"j8","source_pages":[130],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c30","text":"The ~200-molecule database holds 14,756 HF DI entries; C-C DIs plateau near 1.0, 1.4 and 1.8; C-O near 0.8, ~1.2 (aldehydes) and ~1.4 (ketones); weak interactions separate sharply from bonds near 0.5.","node":"4.2.4","figure":"Fig. 4.1","stage":"j8","source_pages":[131,133],"basis":"stated","confidence":"high","figure_ids":["fig.4.1"]},{"id":"c31","text":"k-means with three centroids on (DI, distance) pairs recovers the plateaus.","node":"4.2.4","figure":"Fig. 4.2","stage":"j8","source_pages":[133,134],"basis":"stated","confidence":"high","figure_ids":["fig.4.2"]},{"id":"c32","text":"DI reflects bond polarity (N2 3.043 vs HCN C-N 2.340), inductive decay along homologous series, and resonance (phenoxide C-O 1.070).","node":"4.2.5","figure":"Fig. 4.3-4.4","stage":"j8","source_pages":[135,137],"basis":"stated","confidence":"high","figure_ids":["fig.4.3","fig.4.4"]},{"id":"c33","text":"For N8, DIs and QTAIM charges below 0.14 e argue against Hirshberg et al.'s ionic NBO structure and for a pentavalent-nitrogen Lewis structure.","node":"4.3.1","figure":"Fig. 4.5-4.6","stage":"j9","source_pages":[138,139],"basis":"stated","confidence":"high","figure_ids":["fig.4.5","fig.4.6"]},{"id":"c34","text":"In dilithium cyclopropane (planar tetracoordinate carbon) C-C DIs are 0.98-1.11 and the C-Li DI (0.197) is close to LiH (0.193), so the Li bonds are ionic and no concept needs revising.","node":"4.3.2","figure":"Fig. 4.7","stage":"j9","source_pages":[140,141],"basis":"stated","confidence":"high","figure_ids":["fig.4.7"]},{"id":"c35","text":"In (eta4-C4H6)Fe(CO)3, DI(terminal C, Fe) = 0.469 versus 0.292 for the central carbon at HF (0.788 vs 0.286 at CCSD); the total ~1.7 is a double bond, despite no bond path to terminal carbons.","node":"4.3.3","figure":"Fig. 4.8","stage":"j9","source_pages":[142,143],"basis":"stated","confidence":"high","figure_ids":["fig.4.8"]},{"id":"c36","text":"The DI is proposed as a general bond-order indicator; whether it works as an FFLUX exchange potential is left as future work.","node":"4.4","figure":null,"stage":"j9","source_pages":[117,143,144],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c37","text":"Chapter 4 was published as Outeiral et al., Chem. Sci. 2018, 9, 5517-5529; the author did the vast majority of calculations and all of the analysis.","node":"A.1","figure":null,"stage":"j9","source_pages":[115,186],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c38","text":"The six permutation-equivalent methanol minima share one Hamiltonian, but ordinary kriging trained on one seed either collapses or optimises to unphysical structures, for example ignoring the rotation barrier.","node":"ch5","figure":"Fig. 5.1","stage":"j10","source_pages":[146,148],"basis":"stated","confidence":"high","figure_ids":["fig.5.1"]},{"id":"c39","text":"Prior work uses permutation-invariant features (Behler-Parrinello, bispectrum, SOAP, Coulomb matrices) or invariant models (invariant polynomials).","node":"5.1","figure":null,"stage":"j10","source_pages":[149,153],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c40","text":"A kernel summed over the group images of each training point gives an invariant GP predictor, proved via the rearrangement theorem, an isotropic kernel and isometric representations.","node":"5.2.2","figure":"Eq. 5.22","stage":"j10","source_pages":[159,161],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c41","text":"Pure symmetry-adapted kriging needs N kernel evaluations per training point (O(NM)), so it saves nothing by itself.","node":"5.2.2","figure":null,"stage":"j10","source_pages":[162],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c42","text":"Heuristic: map the query into the modelled region by choosing the symmetry image with minimum Kabsch RMSD to a pivot (a PES minimum); cost drops to O(M).","node":"5.3.1","figure":"Fig. 5.2-5.3","stage":"j11","source_pages":[164,165],"basis":"stated","confidence":"high","figure_ids":["fig.5.2","fig.5.3"]},{"id":"c43","text":"Implemented as fflux_symmetry_transformation in two_body_forces.f90 of DL_POLY FFLUX, reading matrices from MATRICES.txt; feature and force routines unchanged.","node":"5.3.2","figure":"Fig. 5.4","stage":"j11","source_pages":[165,166],"basis":"stated","confidence":"high","figure_ids":["fig.5.4"]},{"id":"c44","text":"With 100 MP2/cc-pVTZ points per curve, SAGPR reproduces the stretch of every symmetry-equivalent bond in H2O and NH3, while ordinary GP fails on relabelled bonds.","node":"5.4.1","figure":"Fig. 5.5-5.6","stage":"j12","source_pages":[167,170],"basis":"stated","confidence":"high","figure_ids":["fig.5.5","fig.5.6"]},{"id":"c45","text":"Methanol (600 training points, 6,000 test geometries): symmetry-adapted minimisations converge to the B3LYP/aug-cc-pVTZ minimum (mean RMSD 0.002 +/- 0.004 A); baseline runs mostly end in wrong structures.","node":"5.4.2","figure":"Fig. 5.8-5.10","stage":"j12","source_pages":[171,173],"basis":"stated","confidence":"high","figure_ids":["fig.5.8","fig.5.9","fig.5.10"]},{"id":"c46","text":"Acetaldehyde (900 training points) shows the same pattern as methanol.","node":"5.4.2","figure":"Fig. 5.11-5.13","stage":"j12","source_pages":[171,176,179],"basis":"stated","confidence":"high","figure_ids":["fig.5.11","fig.5.12","fig.5.13"]},{"id":"c47","text":"Symmetry adaptation lets the training set shrink about six-fold relative to adding all permuted copies.","node":"5.5","figure":null,"stage":"j12","source_pages":[180],"basis":"stated","confidence":"high","figure_ids":[]},{"id":"c48","text":"Conclusions claim DI is proven to be a first-order V_xc approximation, Müller is valid to ~10% for directly bonded atoms, and SAGPR is ready to deploy.","node":"ch6","figure":null,"stage":"j13","source_pages":[182,185],"basis":"stated","confidence":"medium","figure_ids":[]}],"edge_types":["answers_limitation","appendix_ref","builds_on","chapter_ref","equation_ref","figure_ref","page_ref","reuses_method","same_concept","same_content","same_dataset","section_ref","summarises","table_ref"]},"notes":[{"id":"n1","text":"Polarisation error in water clusters is ~16 kcal/mol in total on p. 103 but 'about 20 kcal/mol' on p. 114 (checked on page image).","pages":[103,114],"kind":"source inconsistency"},{"id":"n2","text":"Conclusions say Müller is within a 10% error bound for directly bonded atoms (p. 183); Table 4.1 lists F-F at 34.1% and N-N at 11.4% (p. 128), though the text treats F2 and HF as exceptions.","pages":[128,183],"kind":"source inconsistency"},{"id":"n3","text":"Benzaldehyde C-O DI: thesis p. 137 and the Fig. 4.4 caption give 0.798; the published paper's text gives benzaldehyde 1.297 and 0.798 for propanol (p. 196, checked on page image).","pages":[136,137,196],"kind":"source inconsistency"},{"id":"n4","text":"Chapter 1 promises that Chapter 6 outlines 'future lines of work' (p. 21); Chapter 6 contains no such list. Future-work remarks are scattered in 3.4, 4 (p. 117) and 5.3.1.","pages":[21,104,109,117,165],"kind":"observation"},{"id":"n5","text":"Pages 187-200 are a copy of the journal paper and carry the journal's pagination (5497-5529); thesis page numbers there are counted, not printed.","pages":[187,200],"kind":"page-map caveat"}]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js" crossorigin="anonymous"></script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('thesis-data').textContent);
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const el = (tag, attrs={}, ...kids) => { const e = document.createElement(tag); for (const [k,v] of Object.entries(attrs)) { if (v===false||v==null) continue; if (k==='class') e.className=v; else if (k==='text') e.textContent=v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v===true?'':v); } for (const kid of kids.flat()) if (kid!=null) e.append(kid.nodeType?kid:document.createTextNode(kid)); return e; };

/* ---------------- data ---------------- */
const NODES = D.structure.nodes, N = new Map(NODES.map(n=>[n.id,n]));
const ENT = new Map(D.links.entities.map(e=>[e.id,e]));
const CL = new Map(D.links.claims.map(c=>[c.id,c]));
const ST = new Map(D.journey.stages.map(s=>[s.id,s]));
const EDGES = D.links.edges;
const ROOTS = D.structure.roots;
const isLeaf = n => n.type==='figure'||n.type==='table';
const anc = id => { const out=[]; let n=N.get(id); while(n&&n.parent){ out.push(n.parent); n=N.get(n.parent);} return out; };
const desc = id => { const out=[]; (N.get(id)?.children||[]).forEach(c=>{out.push(c, ...desc(c));}); return out; };
const stageNodes = new Map(); NODES.forEach(n=>n.stages.forEach(s=>{ if(!stageNodes.has(s)) stageNodes.set(s,new Set()); stageNodes.get(s).add(n.id); }));
const OUTCOME = {
  worked:{label:'Worked', color:'var(--worked)', desc:'Reached its aim'},
  partial:{label:'Partial', color:'var(--partial)', desc:'Part of the aim reached'},
  failed:{label:'Failed (negative result)', color:'var(--failed)', desc:'Hypothesis or model failed the test'},
  pivot:{label:'Pivot', color:'var(--pivot)', desc:'Direction changed'}
};
const TYPE_LABEL = {front:'Front matter',background:'Background',method:'Method',result:'Result',discussion:'Discussion',appendix:'Appendix / back matter',figure:'Figure',table:'Table'};
const ACTS = [
  {title:'Frame and formalise', stages:['j1','j2']},
  {title:'Audit FFLUX (negative results)', stages:['j3','j4','j5']},
  {title:'Delocalization index (Ch. 4)', stages:['j6','j7','j8','j9']},
  {title:'Symmetry-adapted kriging (Ch. 5)', stages:['j10','j11','j12']},
  {title:'Synthesis', stages:['j13']}
];

/* ---------------- helpers ---------------- */
const pgRange = (a,b) => a===b ? `p. ${a}` : `pp. ${a}–${b}`;
const pgList = l => { l=[...new Set(l)].sort((x,y)=>x-y); return l.length===1?`p. ${l[0]}`:`pp. ${l.join(', ')}`; };
function mergeRanges(rs){ const s=rs.map(r=>[...r]).sort((a,b)=>a[0]-b[0]); const out=[]; s.forEach(r=>{ const l=out[out.length-1]; if(l&&r[0]<=l[1]+1) l[1]=Math.max(l[1],r[1]); else out.push(r); }); return out; }
const pgEl = (txt) => el('span',{class:'pg',text:txt});
const nodePg = n => pgEl(pgRange(n.pages[0], n.pages[1]) + (n.journal_pages?` (Chem. Sci. ${n.journal_pages})`:''));
const label = n => (isLeaf(n)||!n.number) ? n.title : `${/^\d/.test(n.number)?'':''}${n.number} ${n.title}`;
const fullLabel = n => n.id.startsWith('ch') ? `Ch. ${n.number} ${n.title}` : n.id.startsWith('app') ? `Appendix ${n.number} ${n.title}` : isLeaf(n) ? `${n.number}: ${n.title}` : label(n);
const typeColor = t => `var(--t-${t})`;
const basisTag = b => el('span',{class:'basis '+b, title: b==='stated'?'The author says this':'My inference', text:b});
const ctext = c => c==='high'?'':` · confidence: ${c}`;
function tryStore(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null;} }

/* ---------------- state ---------------- */
const S = {tab:'journey', sel:null, expanded:new Set(['ch3','ch4','ch5']), metric:'pages', leaves:false,
  level:'chapter', showEnt:{method:false,software:false,dataset:false,term:false}, showFig:false,
  etypes:null, basisF:{stated:true,inferred:true}};
function select(ref, opts={}){
  S.sel = ref;
  if (opts.tab) S.tab = opts.tab;
  if (ref && ref.kind==='node'){ const n=N.get(ref.id); if(n&&isLeaf(n)) { S.showFig = true; } anc(ref.id).forEach(a=>S.expanded.add(a)); if(n&&isLeaf(n)) S.leaves=true; }
  if (ref && ref.kind==='stage'){ ST.get(ref.id).evidence.forEach(e=>anc(e.node).forEach(a=>S.expanded.add(a))); }
  if (ref && ref.kind==='entity'){ const e=ENT.get(ref.id); S.showEnt[e.type]=true; }
  renderAll(opts);
  writeHash();
}
function related(sel){
  const r = {nodes:new Set(), stages:new Set(), entities:new Set()};
  if(!sel) return r;
  const addNode = id => { r.nodes.add(id); anc(id).forEach(a=>r.nodes.add(a)); };
  if (sel.kind==='node'){
    addNode(sel.id); desc(sel.id).forEach(d=>r.nodes.add(d));
    const ids=[sel.id,...desc(sel.id)]; ids.forEach(i=>N.get(i).stages.forEach(s=>r.stages.add(s)));
    ENT.forEach(e=>{ if(e.sections.some(s=>ids.includes(s))) r.entities.add(e.id); });
  } else if (sel.kind==='stage'){
    r.stages.add(sel.id); (stageNodes.get(sel.id)||[]).forEach(addNode);
  } else if (sel.kind==='entity'){
    const e=ENT.get(sel.id); r.entities.add(e.id); e.sections.forEach(addNode);
    e.sections.forEach(s=>N.get(s).stages.forEach(x=>r.stages.add(x)));
  } else if (sel.kind==='claim'){
    const c=CL.get(sel.id); addNode(c.node); r.stages.add(c.stage); (c.figure_ids||[]).forEach(addNode);
  } else if (sel.kind==='edge'){
    (sel.ends||[]).forEach(addNode);
  }
  return r;
}

/* ---------------- header ---------------- */
$('#byline').textContent = `${D.meta.author} · ${D.meta.degree} · ${D.meta.year} · supervisor ${D.meta.supervisor.split(' (')[0]}`;
$('#arc').textContent = D.journey.arc;

/* ---------------- theme ---------------- */
(function(){
  const root=document.documentElement, btn=$('#theme');
  let mode = tryStore('thesis-map-theme') || 'auto';
  const apply=()=>{ if(mode==='auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme',mode); btn.textContent='Theme: '+mode; btn.setAttribute('aria-label','Colour theme: '+mode+'. Activate to change.'); };
  btn.addEventListener('click',()=>{ mode = mode==='auto'?'light':mode==='light'?'dark':'auto'; tryStore('thesis-map-theme',mode); apply(); });
  apply();
})();

/* ---------------- tabs ---------------- */
const TABS=['journey','structure','links'];
function showTab(t){
  S.tab=t;
  TABS.forEach(x=>{ const on=x===t; const b=$('#tab-'+x); b.setAttribute('aria-selected',on); b.tabIndex=on?0:-1; $('#view-'+x).hidden=!on; });
  if(t==='links') drawGraph(); else stopGraph();
  
}
TABS.forEach(t=>{
  const b=$('#tab-'+t);
  b.addEventListener('click',()=>{ showTab(t); writeHash(); });
  b.addEventListener('keydown',e=>{ const i=TABS.indexOf(t); let j=null; if(e.key==='ArrowRight') j=(i+1)%3; if(e.key==='ArrowLeft') j=(i+2)%3; if(e.key==='Home') j=0; if(e.key==='End') j=2; if(j!=null){ e.preventDefault(); showTab(TABS[j]); $('#tab-'+TABS[j]).focus(); writeHash(); } });
});

/* ---------------- tooltip ---------------- */
const tip=$('#tip');
function showTip(html, x, y){ tip.innerHTML=''; if(typeof html==='string') tip.textContent=html; else tip.append(html); tip.hidden=false; const w=tip.offsetWidth,h=tip.offsetHeight; tip.style.left=Math.max(8,Math.min(innerWidth-w-8,x+14))+'px'; tip.style.top=Math.max(8,Math.min(innerHeight-h-8,y+14))+'px'; }
function hideTip(){ tip.hidden=true; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') hideTip(); });

/* =====================================================================
   JOURNEY
   ===================================================================== */
function outcomeSvg(o, size=40){
  const c=OUTCOME[o].color, s=size, h=s/2;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width',s); svg.setAttribute('height',s); svg.setAttribute('viewBox','0 0 40 40'); svg.setAttribute('aria-hidden','true');
  const ns=(t,a)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',t); for(const k in a) e.setAttribute(k,a[k]); return e;};
  const ring={stroke:'var(--surface)','stroke-width':3};
  if(o==='worked'){ svg.append(ns('circle',{cx:20,cy:20,r:17,fill:c,...ring}), ns('path',{d:'M12 20.5l5.5 5.5L28.5 14',fill:'none',stroke:'#fff','stroke-width':3.4,'stroke-linecap':'round','stroke-linejoin':'round'})); }
  else if(o==='partial'){ const id='hp'+Math.random().toString(36).slice(2,7);
    svg.append(ns('rect',{x:4,y:4,width:32,height:32,rx:9,fill:'var(--surface)',stroke:c,'stroke-width':3}),
      ns('clipPath',{id}), ns('path',{d:'M20 7a13 13 0 0 1 0 26z',fill:c}), ns('circle',{cx:20,cy:20,r:13,fill:'none',stroke:'var(--ink)','stroke-width':1.6}) ); }
  else if(o==='failed'){ svg.append(ns('path',{d:'M20 3L37.5 34H2.5z',fill:c,...ring,'stroke-linejoin':'round'}), ns('path',{d:'M14.5 18.5l11 11M25.5 18.5l-11 11',stroke:'#fff','stroke-width':3.2,'stroke-linecap':'round'})); }
  else { svg.append(ns('path',{d:'M20 2.5L37.5 20L20 37.5L2.5 20z',fill:c,...ring,'stroke-linejoin':'round'}), ns('path',{d:'M12.5 17h13l-3.5-3.5M27.5 23h-13l3.5 3.5',fill:'none',stroke:'#fff','stroke-width':2.6,'stroke-linecap':'round','stroke-linejoin':'round'})); }
  return svg;
}
function buildJourney(){
  const story=$('#story'); story.innerHTML='';
  ACTS.forEach(a=>{
    const row=el('div',{class:'row'});
    a.stages.forEach(id=>{
      const s=ST.get(id), idx=D.journey.stages.indexOf(s)+1;
      const chap=[...new Set(s.chapters.map(c=>{ const n=N.get(c); return n.chapter; }))].map(c=>N.get(c)).map(n=>n.id.startsWith('ch')?'Ch. '+n.number:n.id.startsWith('app')?'App. '+n.number:n.title);
      const rng=mergeRanges(s.evidence.map(e=>e.pages));
      const b=el('button',{class:'stage','data-id':id,'aria-label':`Stage ${idx}: ${s.title}. Outcome: ${OUTCOME[s.outcome].label}.`},
        el('span',{class:'track'}, outcomeSvg(s.outcome,44)),
        el('span',{class:'body'},
          el('span',{class:'num',text:`STAGE ${idx}`}),
          el('span',{class:'ttl',text:s.title}),
          el('span',{class:'out',style:`color:var(--ink)`}, el('span',{class:'dot',style:`background:${OUTCOME[s.outcome].color}`}), ' '+OUTCOME[s.outcome].label.replace(' (negative result)','')),
          el('span',{class:'meta'}, chap.join(' · ')+' · ', pgEl(rng.map(r=>pgRange(r[0],r[1])).join(', ').replace(/pp?\. /g,(m,i)=>i===0?m:''))) ));
      b.addEventListener('click',()=>select({kind:'stage',id}));
      b.addEventListener('keydown',e=>{ const all=$$('.stage'); const i=all.indexOf(b); if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); all[Math.min(all.length-1,i+1)].focus(); } if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); all[Math.max(0,i-1)].focus(); } });
      if(id==='j3') b.querySelector('.body').append(el('span',{class:'meta',text:'◂ left open: no later fix'}));
      if(id==='j4'||id==='j5') b.querySelector('.body').append(el('span',{class:'meta',text:'\u25b8 motivates Ch. 5 (p. '+(id==='j4'?'148':'113, 183')+')'}));
      if(id==='j10') b.querySelector('.body').append(el('span',{class:'meta',text:'\u25c2 motivated by stages 4\u20135 (pp. 148, 183)'}));
      if(id==='j6') b.querySelector('.body').append(el('span',{class:'meta',text:'↻ exchange term becomes a bond-order study'}));
      row.append(b);
    });
    story.append(el('div',{class:'act'}, el('h3',{text:a.title}), row));
  });
  const lg=$('#jlegend'); lg.innerHTML='';
  Object.keys(OUTCOME).forEach(o=>{ const w=el('span',{}, outcomeSvg(o,22), ' '+OUTCOME[o].label+' – '+OUTCOME[o].desc); lg.append(w); });
  lg.append(el('span',{text:'Acts are my grouping of the stages.'}));
}
function updateJourney(){
  const r=related(S.sel); const jv=$('#view-journey');
  $$('.stage').forEach(b=>{ const id=b.dataset.id; b.classList.toggle('is-sel',S.sel?.kind==='stage'&&S.sel.id===id); b.classList.toggle('is-rel',r.stages.has(id)); b.setAttribute('aria-pressed', S.sel?.kind==='stage'&&S.sel.id===id); });
  jv.classList.toggle('dim', !!S.sel && r.stages.size>0);
}

/* =====================================================================
   STRUCTURE
   ===================================================================== */
const metricOf = n => S.metric==='pages' ? (n.pages[1]-n.pages[0]+1) : n.approx_words;
function visibleRows(){

  L.forEach(l=>{ const s=l.source.id||l.source, t=l.target.id||l.target; ul.append(el('li',{}, el('button',{class:'chip',onclick:()=>select({kind:'edge',key:l.key,ends:[...new Set(l.items.flatMap(e=>[e.source,e.target]))].filter(x=>N.has(x))})},`${nm(s)} → ${nm(t)}`), ` ${l.group.label}, ${l.basis}${l.items.length>1?' ×'+l.items.length:''} `, pgEl(pgList(l.items.flatMap(e=>e.source_pages))) )); });
}
function updateLinks(){
  const g=$('#graph'); if(!g||!g.querySelector) return; const r=related(S.sel);
  const selIds=new Set();
  if(S.sel){ if(S.sel.kind==='node'){ selIds.add(displayId(S.sel.id)); if(isLeaf(N.get(S.sel.id))) selIds.add(S.sel.id); }
    else if(S.sel.kind==='entity') selIds.add(S.sel.id);
    else r.nodes.forEach(id=>{ const n=N.get(id); if(n&&!isLeaf(n)&&(S.level==='chapter'?n.level===0:n.level<= (S.level==='section'?1:2))) selIds.add(displayId(id)); }); }
  const nbr=new Set();
  d3.select('#graph').selectAll('g.lk').each(function(d){ const touch=S.sel&&(selIds.has(d.source.id)||selIds.has(d.target.id)); d3.select(this).selectAll('path.link').classed('is-rel',!!touch); if(touch){ nbr.add(d.source.id); nbr.add(d.target.id);} });
  d3.select('#graph').selectAll('g.node').classed('is-sel',d=>S.sel&&selIds.has(d.id)&&(S.sel.kind==='entity'||S.sel.kind==='node')).classed('is-rel',d=>!!S.sel&&(nbr.has(d.id)||(S.sel.kind!=='entity'&&S.sel.kind!=='node'&&selIds.has(d.id))));
  d3.select('#view-links').classed('gdim',!!S.sel&&selIds.size>0);
}

/* =====================================================================
   PANEL
   ===================================================================== */
function chipNode(id,txt){ const n=N.get(id); return el('button',{class:'chip',onclick:()=>select({kind:'node',id})}, el('span',{class:'dot',style:`background:${typeColor(n.type)}`}), txt||fullLabel(n)); }
function showIn(id){ return el('span',{}, ...[['journey','Journey'],['structure','Structure'],['links','Links']].map(([t,l])=>el('button',{class:'chip',onclick:()=>{showTab(t);if(t==='structure'){buildStructure();updateStructure();setTimeout(()=>{const r=$(`.trow[data-id="${CSS.escape(id)}"]`); if(r) r.scrollIntoView({block:'center'});},30);} writeHash();}},'Show in '+l))); }
function claimItem(c){ return el('li',{}, el('button',{class:'chip',style:'margin:0 4px 0 0',onclick:()=>select({kind:'claim',id:c.id})},c.id.toUpperCase()), c.text+' ', pgEl(pgList(c.source_pages)), ' ', c.confidence!=='high'?el('span',{class:'basis',text:'confidence: '+c.confidence}):null); }
function renderPanel(){
  const p=$('#panel'); p.innerHTML=''; const sel=S.sel;
  const narrow=innerWidth<=1050; $('#jump').hidden=!(narrow&&sel);
  if(narrow&&sel) p.append(el('button',{class:'chip',onclick:()=>window.scrollTo({top:0,behavior:'smooth'})},'\u2191 Back to the map'));
  if(!sel){
    p.append(el('h2',{text:'How to read this map'}),
      el('p',{text:D.meta.note}),
      el('p',{class:'hint',text:'Click a stage, a chapter, an entity or a graph node. The same item lights up in all three views; the panel shows what the thesis says and where.'}),
      el('h3',{text:'Contributions (stated by the author)'}),
      el('ul',{}, ...D.journey.contribution.map(c=>el('li',{}, c.text+' ', pgEl(pgRange(c.pages[0],c.pages[1]))))),
      el('h3',{text:'Page numbers'}),
      el('p',{class:'hint',text:'Every "p. N" is the printed page number (PDF page minus 1). Pages 187–200 are the journal article, shown with its own Chem. Sci. pagination as well.'}));
    return;
  }
  if(sel.kind==='stage'){ const s=ST.get(sel.id), idx=D.journey.stages.indexOf(s)+1, o=OUTCOME[s.outcome];
    p.append(el('div',{class:'hint',text:`STAGE ${idx} OF ${D.journey.stages.length}`}), el('h2',{text:s.title}),
      el('div',{style:'display:flex;align-items:center;gap:8px;margin:6px 0'}, outcomeSvg(s.outcome,30), el('strong',{text:o.label}), basisTag(s.basis)),
      el('h3',{text:'Question'}), el('p',{text:s.question}),
      el('h3',{text:'Approach'}), el('p',{text:s.approach}),
      el('h3',{text:'Outcome'}), el('p',{text:s.outcome_note}),
      el('h3',{text:'What this led to'}), el('p',{text:s.why_next}),
      el('h3',{text:'Where it lives'}),
      el('div',{}, ...s.chapters.map(c=>chipNode(c)), ...[]),
      el('div',{}, ...s.evidence.map(e=>el('div',{style:'margin:3px 0'}, el('button',{class:'chip',onclick:()=>select({kind:'node',id:e.node},{tab:'structure'})}, 'Open '+(N.get(e.node).number||N.get(e.node).title)+' in Structure'), pgEl(pgRange(...e.pages)), e.what?' '+e.what:''))));
    const cls=D.links.claims.filter(c=>c.stage===s.id); if(cls.length) p.append(el('h3',{text:`Claims at this stage (${cls.length})`}), el('ul',{}, ...cls.map(claimItem)));
    const prev=D.journey.stages[idx-2], next=D.journey.stages[idx];
    p.append(el('div',{style:'margin-top:12px'}, prev?el('button',{class:'chip',onclick:()=>select({kind:'stage',id:prev.id})},'← '+prev.title):null, next?el('button',{class:'chip',onclick:()=>select({kind:'stage',id:next.id})},next.title+' →'):null));
    return; }
  if(sel.kind==='node'){ const n=N.get(sel.id);
    p.append(el('div',{class:'hint',text:TYPE_LABEL[n.type].toUpperCase()+(n.type_note?' · '+n.type_note:'')}), el('h2',{text:fullLabel(n)}),
      el('div',{}, nodePg(n), ' ', n.approx_words?el('span',{class:'pg',text:`~${n.approx_words.toLocaleString()} words`}):null, ' ', (n.n_figures?el('span',{class:'pg',text:`${n.n_figures} fig`}):null), ' ', (n.n_tables?el('span',{class:'pg',text:`${n.n_tables} tab`}):null), ' ', basisTag(n.basis)),
      el('p',{text:n.summary}));
    if(n.quote) p.append(el('div',{class:'quote'}, `“${n.quote.text}” `, pgEl('p. '+n.quote.page)));
    if(n.template) p.append(el('h3',{text:'Internal template'}), el('ol',{class:'tplate'}, ...n.template.map(t=>el('li',{text:t}))));
    if(n.publication) p.append(el('h3',{text:'Publication / collaboration'}), el('p',{}, el('strong',{text:n.publication.status+'. '}), n.publication.note+' ', pgEl(pgList(n.publication.pages))));
    const st=[...new Set([...n.stages, ...desc(n.id).flatMap(d=>N.get(d).stages)])];
    if(st.length) p.append(el('h3',{text:'Journey stages'}), el('div',{}, ...st.map(id=>{ const s=ST.get(id); return el('button',{class:'chip',onclick:()=>select({kind:'stage',id})}, el('span',{class:'dot',style:`background:${OUTCOME[s.outcome].color}`}), s.title); })));
    const ids=[n.id,...desc(n.id)]; const cls=D.links.claims.filter(c=>ids.includes(c.node)||(c.figure_ids||[]).some(f=>ids.includes(f)));
    if(cls.length) p.append(el('h3',{text:`Claims (${cls.length})`}), el('ul',{}, ...cls.map(claimItem)));
    const leaves=n.children.filter(c=>isLeaf(N.get(c)));
    if(leaves.length) p.append(el('h3',{text:'Figures and tables here'}), el('div',{}, ...leaves.map(id=>{ const f=N.get(id); return el('button',{class:'chip',title:f.title,onclick:()=>select({kind:'node',id})}, `${f.number} · ${nodePgTxt(f)}`); })));
    const inc=EDGES.filter(e=>e.target===n.id&&!isLeaf(N.get(e.source))), out=EDGES.filter(e=>e.source===n.id);
    const edgeLi=(e,dir)=>{ const other=N.get(dir==='out'?e.target:e.source); return el('li',{}, dir==='out'?'→ ':'← ', el('button',{class:'chip',style:'margin:0 4px 0 0',onclick:()=>select({kind:'node',id:other.id})},fullLabel(other)), el('span',{class:'basis '+e.basis,text:e.type.replace(/_/g,' ')}), ' ', e.reason?e.reason+' ':(e.refs?`(${e.refs.slice(0,3).join(', ')}) `:''), pgEl(pgList(e.source_pages))); };
    const dedupe=(l)=>{ const seen=new Set(); return l.filter(e=>{ const k=e.source+e.target+e.type; if(seen.has(k)) return false; seen.add(k); return true; }); };
    const all=[...dedupe(out).map(e=>edgeLi(e,'out')), ...dedupe(inc).map(e=>edgeLi(e,'in'))];
    if(all.length) p.append(el('h3',{text:`Links (${all.length})`}), el('ul',{}, ...all.slice(0,14)), all.length>14?el('p',{class:'hint',text:`…${all.length-14} more are in the Links view.`}):null);
    const ents=[...ENT.values()].filter(e=>e.sections.some(s=>ids.includes(s)));
    if(ents.length) p.append(el('h3',{text:`Entities mentioned (${ents.length})`}), el('div',{}, ...ents.slice(0,24).map(e=>el('button',{class:'chip',onclick:()=>select({kind:'entity',id:e.id})}, el('span',{class:'dot',style:`background:var(--e-${e.type})`}), e.name))));
    p.append(el('div',{style:'margin-top:12px'}, showIn(n.id)));
    return; }
  if(sel.kind==='entity'){ const e=ENT.get(sel.id);
    p.append(el('div',{class:'hint',text:('ENTITY · '+e.type).toUpperCase()}), el('h2',{text:e.name}), el('p',{text:e.description}),
      el('div',{}, basisTag(e.basis), el('span',{class:'basis',text:'confidence: '+e.confidence}), ' ', pgEl(`${e.n_mentions} mentions on ${e.n_pages} pages`)),
      el('h3',{text:'Appears in'}), el('div',{}, ...e.chapters.map(c=>chipNode(c))),
      el('h3',{text:'Sections'}), el('div',{}, ...e.sections.slice(0,30).map(s=>chipNode(s,(N.get(s).number||N.get(s).title)))),
      el('h3',{text:'Page references'}), el('p',{}, pgEl(pgList(e.source_pages)), e.n_pages>e.source_pages.length?` …and ${e.n_pages-e.source_pages.length} more pages`:''));
    const cls=D.links.claims.filter(c=>e.sections.includes(c.node)); if(cls.length) p.append(el('h3',{text:'Claims in those sections'}), el('ul',{}, ...cls.slice(0,8).map(claimItem)));
    p.append(el('p',{class:'hint',text:'Found by text search of the OCR, so counts include passing mentions.'}));
    return; }
  if(sel.kind==='claim'){ const c=CL.get(sel.id), n=N.get(c.node), s=ST.get(c.stage);
    p.append(el('div',{class:'hint',text:'CLAIM '+c.id.toUpperCase()}), el('h2',{text:c.text}),
      el('div',{}, basisTag(c.basis), el('span',{class:'basis',text:'confidence: '+c.confidence}), ' ', pgEl(pgList(c.source_pages))),
      el('h3',{text:'Supported in'}), el('div',{}, chipNode(c.node), ...(c.figure_ids||[]).map(f=>chipNode(f,N.get(f).number))),
      el('h3',{text:'Stage'}), el('div',{}, el('button',{class:'chip',onclick:()=>select({kind:'stage',id:s.id})}, el('span',{class:'dot',style:`background:${OUTCOME[s.outcome].color}`}), s.title)));
    return; }
  if(sel.kind==='edge'){ const items=[]; EDGES.forEach(e=>{ if(gcache){ const l=gcache.links.find(x=>x.key===sel.key); if(l&&l.items.includes(e)) items.push(e);} });
    p.append(el('div',{class:'hint',text:'LINK'}), el('h2',{text:`${items.length} link${items.length===1?'':'s'}`}));
    items.forEach(e=>p.append(el('div',{style:'margin:8px 0;padding:8px 10px;border:1px solid var(--line);border-radius:8px'},
      el('div',{}, chipNode(e.source), '→ ', chipNode(e.target)),
      el('div',{}, basisTag(e.basis), el('span',{class:'basis',text:e.type.replace(/_/g,' ')}), pgEl(pgList(e.source_pages)), e.confidence!=='high'?el('span',{class:'basis',text:'confidence: '+e.confidence}):null),
      el('p',{text:e.reason||(e.refs?'Cited in the text as: '+e.refs.join(', '):'')}))));
    return; }
}
const nodePgTxt = n => pgRange(n.pages[0],n.pages[1]).replace('pp. ','p. ');

/* ---------------- search ---------------- */
const INDEX=[];
NODES.forEach(n=>INDEX.push({kind:'node',id:n.id,text:fullLabel(n),hay:(fullLabel(n)+' '+n.summary).toLowerCase(),page:pgRange(...n.pages),tag:isLeaf(n)?n.type:'part'}));
ENT.forEach(e=>INDEX.push({kind:'entity',id:e.id,text:e.name,hay:(e.name+' '+e.description).toLowerCase(),page:pgList(e.source_pages.slice(0,3)),tag:'entity'}));
CL.forEach(c=>INDEX.push({kind:'claim',id:c.id,text:c.text,hay:c.text.toLowerCase(),page:pgList(c.source_pages),tag:'claim'}));
ST.forEach(s=>INDEX.push({kind:'stage',id:s.id,text:s.title,hay:(s.title+' '+s.question).toLowerCase(),page:'',tag:'stage'}));
const qi=$('#q'), rs=$('#results'); let ri=-1, rlist=[];
function runSearch(){
  const q=qi.value.trim().toLowerCase(); rs.innerHTML=''; ri=-1; rlist=[];
  if(!q){ rs.hidden=true; qi.setAttribute('aria-expanded','false'); return; }
  const toks=q.split(/\s+/);
  rlist=INDEX.filter(x=>toks.every(t=>x.hay.includes(t))).sort((a,b)=>{ const sa=a.text.toLowerCase().includes(q)?0:1, sb=b.text.toLowerCase().includes(q)?0:1; const order={stage:0,entity:1,node:2,claim:3}; return sa-sb||order[a.kind]-order[b.kind]; }).slice(0,14);
  if(!rlist.length) rs.append(el('div',{class:'none',text:'No matches'}));
  rlist.forEach((x,i)=>{ const b=el('button',{role:'option','aria-selected':'false','data-i':i}, el('span',{class:'kind',text:x.tag}), el('span',{class:'rt',text:x.text}), x.page?pgEl(x.page):null); b.addEventListener('click',()=>pick(i)); rs.append(b); });
  rs.hidden=false; qi.setAttribute('aria-expanded','true');
}
function pick(i){ const x=rlist[i]; if(!x) return; rs.hidden=true; qi.setAttribute('aria-expanded','false'); qi.value=''; select({kind:x.kind,id:x.id}); }
function mark(){ $$('#results button').forEach((b,i)=>b.setAttribute('aria-selected',String(i===ri))); const b=$$('#results button')[ri]; if(b) b.scrollIntoView({block:'nearest'}); }
qi.addEventListener('input',runSearch);
qi.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); ri=Math.min(rlist.length-1,ri+1); mark(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); ri=Math.max(0,ri-1); mark(); }
  else if(e.key==='Enter'){ if(ri<0) ri=0; pick(ri); }
  else if(e.key==='Escape'){ rs.hidden=true; qi.setAttribute('aria-expanded','false'); }
});
document.addEventListener('click',e=>{ if(!e.target.closest('.search')){ rs.hidden=true; qi.setAttribute('aria-expanded','false'); } });

/* ---------------- footer ---------------- */
(function(){
  const f=$('#foot');
  f.append(el('details',{}, el('summary',{text:'Source observations and caveats'}), el('ul',{}, ...D.notes.map(n=>el('li',{}, el('strong',{text:n.kind+': '}), n.text+' ', pgEl(pgList(n.pages))))),
    el('p',{text:`OCR: ${D.meta.page_map.ocr}`}), el('p',{text:`Page map: ${D.meta.page_map.rule}; verified on ${D.meta.page_map.verified_on} of ${D.meta.page_map.of} pages.`}),
    el('p',{text:'Entity counts come from text search of OCR output, so equations and OCR errors can drop or add mentions. Figures and tables are leaf nodes; the Links view hides them by default.'})));
})();

/* ---------------- hash ---------------- */
function writeHash(){ try{ const h=`#${S.tab}`+(S.sel&&S.sel.id?`/${S.sel.kind}:${S.sel.id}`:''); history.replaceState(null,'',h); }catch(e){} }
function readHash(){ try{ const m=location.hash.slice(1).match(/^(journey|structure|links)(?:\/(node|stage|entity|claim):(.+))?$/); if(!m) return; S.tab=m[1]; if(m[2]){ const id=decodeURIComponent(m[3]); const ok=m[2]==='node'?N.has(id):m[2]==='stage'?ST.has(id):m[2]==='entity'?ENT.has(id):CL.has(id); if(ok) S.sel={kind:m[2],id}; } }catch(e){} }

/* ---------------- render ---------------- */
function renderAll(opts={}){
  if(S.sel&&S.sel.kind==='node'){ const n=N.get(S.sel.id); if(n&&isLeaf(n)) $('#s-leaves').checked=true; }
  buildStructure(); updateStructure(); updateJourney(); renderPanel();
  if(opts.tab) showTab(opts.tab);
  if(S.tab==='links'){ buildLinkTools(); drawGraph(true); }
  if(S.sel){ const sc=S.sel.kind==='node'&&S.tab==='structure'?$(`.trow[data-id="${CSS.escape(S.sel.id)}"]`):S.sel.kind==='stage'&&S.tab==='journey'?$(`.stage[data-id="${S.sel.id}"]`):null; if(sc) sc.scrollIntoView({block:'nearest',inline:'center'}); }
  if(innerWidth<=1050 && S.sel && opts.fromUser!==false) { /* panel sits below the view on narrow screens */ }
}
$('#jump').addEventListener('click',()=>$('#panel').scrollIntoView({behavior:'smooth',block:'start'}));
const setHint=()=>{ $('#jhint').textContent = innerWidth<=760 ? 'Select a stage.' : 'Select a stage. Scroll sideways for the rest.'; };
setHint(); window.addEventListener('resize',()=>{ setHint(); renderPanel(); });
readHash();
buildJourney(); buildLinkTools();
$('#s-leaves').checked=S.leaves;
buildStructure(); updateStructure(); updateJourney(); renderPanel();
showTab(S.tab);
window.__MAP__={S,select,D};
})();
