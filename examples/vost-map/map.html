<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thesis map</title>
<style>
/* Layout concept: a three-lens atlas. Journey is a left-to-right storyline, Structure a collapsible size-scaled tree,
   Links a force graph. One selection drives all three; a side panel (bottom sheet on phones) shows detail with page citations. */
:root{
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#f2f4f8; --surface:#ffffff; --surface-2:#e9edf3; --ink:#12161d; --ink-2:#434c5a; --ink-3:#626c7b;
  --line:#d3d9e2; --line-2:#e4e8ef; --accent:#1f5fbf; --accent-ink:#ffffff; --sel-bg:#dde9fb; --rel-bg:#fff1bd; --pg-bg:#eceff4;
  --worked:#0ca30c; --partial:#fab219; --failed:#d03b3b; --pivot:#6a52d9;
  --t-background:#7d8796; --t-method:#2a78d6; --t-result:#eb6834; --t-discussion:#1baf7a; --t-appendix:#eda100; --t-front:#9aa3b0;
  --c-assay:#ac467b; --c-method:#2a78d6; --c-software:#1baf7a; --c-dataset:#eda100; --c-term:#4a3aa7;
  --e-ref:#6a7483; --e-flow:#2a78d6; --e-reuse:#0e8a5f; --e-ent:#b4bcc8;
  --shadow:0 1px 2px rgba(18,22,29,.08),0 4px 14px rgba(18,22,29,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1319; --surface:#171c24; --surface-2:#1f2630; --ink:#eef1f6; --ink-2:#c1c8d4; --ink-3:#98a2b3;
  --line:#2c3441; --line-2:#232a35; --accent:#6ea8ff; --accent-ink:#0b1220; --sel-bg:#1d3355; --rel-bg:#3a3312; --pg-bg:#222a35;
  --worked:#2dbb2d; --partial:#fab219; --failed:#e66767; --pivot:#9085e9;
  --t-background:#8b95a5; --t-method:#3987e5; --t-result:#d95926; --t-discussion:#199e70; --t-appendix:#c98500; --t-front:#6f7a8a;
  --c-method:#3987e5; --c-software:#199e70; --c-dataset:#c98500; --c-term:#9085e9;
  --e-ref:#8f99a9; --e-flow:#5fa0f3; --e-reuse:#3ec79a; --e-ent:#46505f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1319; --surface:#171c24; --surface-2:#1f2630; --ink:#eef1f6; --ink-2:#c1c8d4; --ink-3:#98a2b3;
  --line:#2c3441; --line-2:#232a35; --accent:#6ea8ff; --accent-ink:#0b1220; --sel-bg:#1d3355; --rel-bg:#3a3312; --pg-bg:#222a35;
  --worked:#2dbb2d; --partial:#fab219; --failed:#e66767; --pivot:#9085e9;
  --t-background:#8b95a5; --t-method:#3987e5; --t-result:#d95926; --t-discussion:#199e70; --t-appendix:#c98500; --t-front:#6f7a8a;
  --c-method:#3987e5; --c-software:#199e70; --c-dataset:#c98500; --c-term:#9085e9;
  --e-ref:#8f99a9; --e-flow:#5fa0f3; --e-reuse:#3ec79a; --e-ent:#46505f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-3)}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding-inline:16px}
.top-in{max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px 0}
.brand{min-width:0;flex:1 1 280px}
.brand h1{font-size:1.05rem;font-weight:600}
.brand p{font-size:.8rem;color:var(--ink-3);overflow-wrap:anywhere}
.tools{display:flex;gap:8px;align-items:center;flex:1 1 320px;justify-content:flex-end;min-width:0}
.search{position:relative;flex:1 1 220px;max-width:420px;min-width:0}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:40px}
.search kbd{position:absolute;right:10px;top:9px;font:12px var(--mono);color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 5px;pointer-events:none}
.results{position:absolute;left:0;right:0;top:46px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:min(60vh,460px);overflow:auto;z-index:40;padding:4px}
.results[hidden]{display:none}
.res{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:6px}
.res[aria-selected="true"],.res:hover{background:var(--sel-bg)}
.res .k{font:500 .68rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);flex:0 0 4.6rem}
.res .t{min-width:0;overflow-wrap:anywhere}
.res .s{display:block;font-size:.78rem;color:var(--ink-3)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:40px;padding:0 12px;white-space:nowrap}
.iconbtn:hover{background:var(--surface-2)}
.tabs{display:flex;gap:2px;max-width:1500px;margin:6px auto 0}
.tab{border:0;background:none;padding:10px 16px;font-weight:500;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab small{font:400 .72rem var(--mono);color:var(--ink-3);margin-left:6px}
.app{max-width:1500px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
main{min-width:0}
.view[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.vh{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:12px}
.vh h2{font-size:1.1rem;font-weight:600}
.vh p{color:var(--ink-3);font-size:.86rem;flex:1 1 320px;min-width:0}

/* page-reference chips */
.pg{font:500 .76rem/1.2 var(--mono);background:var(--pg-bg);color:var(--ink-2);padding:2px 6px;border-radius:5px;white-space:nowrap;display:inline-block;border:1px solid var(--line-2)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{font:500 .7rem var(--mono);letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-align:left;text-decoration:underline;text-underline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-height:34px}
.btn:hover{background:var(--surface-2)}
.btn[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--accent)}

/* ---------- journey ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--ink-2);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.story{overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x proximity}
.track{display:flex;align-items:stretch;gap:0;min-width:max-content}
.grp{display:flex;flex-direction:column;gap:8px;padding:0 4px}
.grp-h{font:500 .72rem var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);border-bottom:2px solid var(--line);padding-bottom:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-row{display:flex;align-items:stretch;flex:1}
.stage{scroll-snap-align:center;width:196px;flex:0 0 196px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.stage:hover{box-shadow:var(--shadow)}
.stage .sh{display:flex;align-items:center;gap:8px;font:600 .8rem var(--mono)}
.stage .st{font-weight:600;font-size:.92rem;line-height:1.3}
.stage .sm{margin-top:auto;display:flex;flex-direction:column;gap:5px;font-size:.78rem;color:var(--ink-3)}
.stage.is-rel{background:var(--rel-bg)}
.stage.is-sel{background:var(--sel-bg);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.stage.is-end,.stage.is-start{border-style:dashed;background:transparent}
.conn{flex:0 0 38px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-3);font:500 .62rem var(--mono);text-transform:uppercase}
.conn svg{width:34px;height:14px;overflow:visible}
.conn.pivot{color:var(--pivot)}
.outcome{font:600 .72rem var(--mono);text-transform:uppercase;letter-spacing:.05em}
.below{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-top:8px}
.below h3{font-size:.95rem;margin-bottom:8px}
.contrib{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.arcp{max-width:68ch;font-size:.95rem}
.note{font-size:.8rem;color:var(--ink-3);margin-top:10px;max-width:70ch}

/* ---------- structure ---------- */
.ctrl{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:12px;font-size:.88rem}
.ctrl label{display:inline-flex;gap:6px;align-items:center}
.ice{display:flex;flex-direction:column;gap:3px;margin-bottom:14px}
.ice-row{display:flex;height:34px;gap:2px}
.seg{border:0;border-radius:4px;min-width:3px;font:500 .72rem var(--mono);color:#fff;overflow:hidden;white-space:nowrap;padding:0 4px;text-align:left;position:relative;background:var(--t-background)}
.seg.t-background{background:var(--t-background)}.seg.t-method{background:var(--t-method);color:#fff}.seg.t-result{background:var(--t-result);color:#2b0f02}
.seg.t-discussion{background:var(--t-discussion);color:#06281d}.seg.t-appendix{background:var(--t-appendix);color:#2b1c00}.seg.t-front-matter,.seg.t-references{background:var(--t-front);color:#10141a}
.seg.is-rel{outline:3px solid var(--partial);outline-offset:-3px}
.seg.is-sel{outline:3px solid var(--ink);outline-offset:-3px}
.tree{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:2px 12px;padding:6px 10px 6px calc(10px + var(--d,0)*18px);border-top:1px solid var(--line-2);cursor:pointer;min-height:40px}
.tree>.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row.is-anc{background:color-mix(in srgb,var(--rel-bg) 55%,transparent)}
.row.is-rel{background:var(--rel-bg)}
.row.is-sel{background:var(--sel-bg);box-shadow:inset 3px 0 0 var(--accent)}
.row .main{display:flex;gap:6px;align-items:flex-start;min-width:0;flex:1 1 260px}
.row .chev{flex:0 0 22px;height:22px;border:0;background:none;color:var(--ink-3);border-radius:4px;padding:0;font-size:.8rem;line-height:22px;text-align:center}
.row .chev:hover{background:var(--line-2)}
.row .tt{min-width:0;overflow-wrap:anywhere}
.row .tt b{font-weight:500}
.row .num{font:500 .8rem var(--mono);color:var(--ink-3);margin-right:6px}
.row .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end;flex:0 1 auto;margin-left:auto}
.row .sub{flex:1 1 100%;font-size:.8rem;color:var(--ink-3);padding-left:28px}
.row.ch>.main .tt{font-weight:600}
.bar{width:84px;height:8px;background:var(--line-2);border-radius:4px;overflow:hidden;flex:0 0 84px}
.bar i{display:block;height:100%;background:var(--t-background);border-radius:4px;min-width:2px}
.bar i.t-method{background:var(--t-method)}.bar i.t-result{background:var(--t-result)}.bar i.t-discussion{background:var(--t-discussion)}.bar i.t-appendix{background:var(--t-appendix)}.bar i.t-front-matter,.bar i.t-references{background:var(--t-front)}
.cnt{font:400 .74rem var(--mono);color:var(--ink-3);white-space:normal;overflow-wrap:anywhere}
.leafrow .num{color:var(--ink-3)}
.leafrow .tt{font-size:.88rem;color:var(--ink-2)}
.ic{display:inline-block;width:14px;height:14px;vertical-align:-2px;margin-right:4px}

/* ---------- links ---------- */
.lctrl{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.lrow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.86rem}
.lrow>b{font:500 .7rem var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);flex:0 0 auto;min-width:5.2rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.8rem;display:inline-flex;align-items:center;gap:6px;min-height:30px}
.chip[aria-pressed="false"]{color:var(--ink-3)}
.chip.flt[aria-pressed="false"]{opacity:.6;text-decoration:line-through;text-decoration-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--accent)}
.sw{width:22px;height:0;border-top:3px solid var(--e-ref);display:inline-block}
.sw.dash{border-top-style:dashed}
.graph{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);position:relative;overflow:hidden;touch-action:pan-y}
.graph svg{display:block;width:100%;height:auto;max-width:100%}
.gnode{cursor:pointer}
.gnode .shape{fill:var(--surface);stroke-width:2.5}
.gnode text{font:500 11px var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.gnode .in{font:600 12px var(--mono);text-anchor:middle;dominant-baseline:central;stroke:none;fill:var(--ink)}
.gnode.is-rel .shape{fill:var(--rel-bg)}
.gnode.is-sel .shape{fill:var(--sel-bg);stroke:var(--ink)!important;stroke-width:4}
.gnode:focus-visible .shape{stroke:var(--accent);stroke-width:4}
.gnode.dim{opacity:.35}
.gnode.entity text,.gnode.leaf text{display:none}
.gnode.entity:hover text,.gnode.entity.is-sel text,.gnode.entity.is-rel text,.gnode.entity:focus text,.gnode.leaf:hover text,.gnode.leaf.is-rel text,.gnode.leaf.is-sel text,.gnode.leaf:focus text{display:block}
.edge .line{fill:none;stroke-width:1.8;pointer-events:none}
.edge .hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.edge.f-ref .line{stroke:var(--e-ref)}.edge.f-flow .line{stroke:var(--e-flow)}.edge.f-reuse .line{stroke:var(--e-reuse)}.edge.f-ent .line{stroke:var(--e-ent);stroke-width:1.2}
.edge.inferred .line{stroke-dasharray:6 4}
.edge.is-rel .line,.edge.is-sel .line{stroke-width:3.4}
.edge.is-sel .line{filter:drop-shadow(0 0 3px var(--accent))}
.edge.dim .line{opacity:.18}
.contain{stroke:var(--line);stroke-width:1.2;stroke-dasharray:2 3}
marker path{stroke:none}
.m-ref{fill:var(--e-ref)}.m-flow{fill:var(--e-flow)}.m-reuse{fill:var(--e-reuse)}
.gtip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:.8rem;max-width:min(320px,86vw);box-shadow:var(--shadow)}
.gtip b{display:block;margin-bottom:2px}
.gtip .pg{background:transparent;color:inherit;border-color:currentColor;opacity:.85}
details.lv{margin-top:12px}
details.lv summary{cursor:pointer;font-weight:500}
.tblwrap{overflow-x:auto;margin-top:8px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font:500 .7rem var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);background:var(--surface-2)}
td .linkbtn{text-align:left}

/* ---------- panel ---------- */
#panel{position:sticky;top:112px;max-height:calc(100vh - 128px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:0}
.ph{position:sticky;top:0;background:var(--surface);z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ph .kind{font:500 .7rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.pb{padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.pb h2{font-size:1.1rem;font-weight:600;overflow-wrap:anywhere}
.pb h3{font:500 .7rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:4px}
.pb section{min-width:0}
.pb ul{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:6px}
.pb ul.plain{list-style:none;padding:0}
.pb q{display:block;border-left:3px solid var(--line);padding-left:10px;color:var(--ink-2);font-style:italic}
.item{border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;min-width:0;overflow-wrap:anywhere}
.item.inf{border-style:dashed}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.88rem}
.kv dt{color:var(--ink-3)}.kv dd{margin:0;overflow-wrap:anywhere}
.badge{display:inline-flex;align-items:center;gap:6px;font:600 .74rem var(--mono);text-transform:uppercase;letter-spacing:.04em}

@media (max-width:1000px){
  .app{grid-template-columns:minmax(0,1fr)}
  html:has(body.has-sel){scroll-padding-bottom:56vh}
  #panel{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:54vh;border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .2s ease;z-index:50;padding-bottom:env(safe-area-inset-bottom,0px)}
  body.has-sel #panel{transform:none}
  body.has-sel .app{padding-bottom:56vh}
  .below{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .tools{justify-content:stretch}
  .bar{display:none}
  .row .meta{justify-content:flex-start;padding-left:28px;margin-left:0}
  .tab{padding:10px 11px}
  .stage{width:168px;flex-basis:168px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="sr" href="#main">Skip to content</a>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1 id="ttl"></h1>
      <p id="sub"></p>
    </div>
    <div class="tools">
      <div class="search" role="search">
        <label class="sr" for="q">Search titles, entities, claims and stages</label>
        <input id="q" type="search" autocomplete="off" placeholder="Search titles, entities, claims" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
        <kbd aria-hidden="true">/</kbd>
        <div id="results" class="results" role="listbox" hidden></div>
      </div>
      <button id="theme" class="iconbtn" type="button" aria-label="Colour theme"></button>
    </div>
  </div>
  <div class="tabs" role="tablist" aria-label="Views">
    <button class="tab" role="tab" id="tab-journey" aria-controls="v-journey" data-tab="journey">Journey<small>story</small></button>
    <button class="tab" role="tab" id="tab-structure" aria-controls="v-structure" data-tab="structure">Structure<small>build</small></button>
    <button class="tab" role="tab" id="tab-links" aria-controls="v-links" data-tab="links">Links<small>connect</small></button>
  </div>
</header>

<div class="app">
  <main id="main" tabindex="-1">
    <section class="view" id="v-journey" role="tabpanel" aria-labelledby="tab-journey"></section>
    <section class="view" id="v-structure" role="tabpanel" aria-labelledby="tab-structure" hidden></section>
    <section class="view" id="v-links" role="tabpanel" aria-labelledby="tab-links" hidden></section>
  </main>
  <aside id="panel" aria-label="Details" aria-live="polite"></aside>

l,"template":null,"publication_status":null,"publication":null,"collaboration":null,"journal_pages":null,"source_pages":["138"],"basis":"stated","confidence":"high","annotations":{}}},"note":"No chapter has a section called 'Limitations' or 'Discussion and limitations'; limitations sit inside the Preface and Conclusions sections. The thesis has a List of Figures but no List of Tables."},"journey":{"arc":"The thesis starts from the cost and high failure rate of drug discovery and asks how machine learning can make the early stages more reliable. It first tests whether a scoring function can avoid memorising dataset bias: PointVS is trained on filtered data, shown to rely on interactions that agree with an interaction profiler, and its attributions are turned into hotspots that improve fragment elaboration. It then moves to generating molecules with diffusion models. Adding distorted molecules as labelled negatives raises the physical plausibility of drug-like samples, but not for the smallest molecules or for flow matching, and an energy label is no better than a simple distance label. A second attempt to simplify generation by assembling molecules from fragment blocks fails to match atomistic models because fragment orientation cannot be encoded consistently. The last project conditions AlphaFold-family predictors on cryo-EM density: late-stage gradient updates in OpenFold stall, Boltz-2 tolerates more, and MSA subsampling adds the early stochasticity needed, with results that stay mixed and rest on simulated maps. The thesis ends with lessons about interpretability, negative data, block-based encodings and early intervention, and an explicit call for better datasets and benchmarks.","caveat":null,"order_note":"Stage order follows the thesis' own narrative order (Ch 2 -> Ch 5). The thesis does not give a research timeline; the only stated sequence is Ch 3 before Ch 4 (Ch 4 reuses the Ch 3 model and metrics, pp. 89, 97). Treat the sequence as narrative, not chronological.","stages":[{"id":"j0","role":"origin","title":"Start: make ML reliable in early drug discovery","question":"Drug discovery fails often and is costly; can deep learning improve the quality of candidates entering trials? To do so a model must master intramolecular bonding (valid molecules) and intermolecular binding, and structure-based work needs an accurate target structure.","approach":null,"outcome":null,"outcome_note":null,"why_next":null,"next":"j1","chapters":["ch1"],"nodes":["s1.1","s1.4","s1.5"],"evidence":[{"node":null,"pages":{"start":"3","end":"3","pdf_start":25,"pdf_end":25}},{"node":null,"pages":{"start":"4","end":"4","pdf_start":26,"pdf_end":26}},{"node":null,"pages":{"start":"5","end":"5","pdf_start":27,"pdf_end":27}},{"node":null,"pages":{"start":"30","end":"30","pdf_start":52,"pdf_end":52}},{"node":null,"pages":{"start":"31","end":"31","pdf_start":53,"pdf_end":53}}],"source_pages":["3","4","5","30","31"],"quote":null,"negative_result":false,"negative_results":[],"basis":"stated","confidence":"high"},{"id":"j1","role":"research","title":"Build a debiased scoring function (PointVS)","question":"Can an ML scoring function stay competitive when training data are filtered so the test proteins and ligands have no close analogues in training?","approach":"PointVS: 48-layer E(n)-equivariant GNN with learned edge attention, pretrained on pose classification (Redocked2020) then fine-tuned on PDBBind General affinities. Training sets filtered at Morgan Tanimoto >0.8 / sequence identity >0.8 to the test set, with size-matched random subsets as control.","outcome":"partial","outcome_note":"Pose ranking barely changed with filtering (Top-1 70% to 68%). Affinity PCC fell from 0.805 to 0.754 with filtering but not with equal-size random removal (0.803), so standard CASF16 numbers are inflated by leakage (284 of 285 Core proteins have a >=90%-identity training counterpart). Debiased PointVS (0.754) still beat AutoDock Vina (0.601). Largely Scantlebury's work (p. 35).","why_next":"Good performance when debiased is only circumstantial evidence that interactions are learned; a more direct test is to look at what the model attributes its score to (p. 52).","next":"j2","chapters":["ch2"],"nodes":["s2.3","s2.4.1","s2.4.2","s2.4.3","s2.5.1","s2.5.1.1","s2.5.1.2"],"evidence":[{"node":null,"pages":{"start":"35","end":"35","pdf_start":57,"pdf_end":57}},{"node":null,"pages":{"start":"37","end":"37","pdf_start":59,"pdf_end":59}},{"node":null,"pages":{"start":"38","end":"38","pdf_start":60,"pdf_end":60}},{"node":null,"pages":{"start":"41","end":"41","pdf_start":63,"pdf_end":63}},{"node":null,"pages":{"start":"49","end":"49","pdf_start":71,"pdf_end":71}},{"node":null,"pages":{"start":"50","end":"50","pdf_start":72,"pdf_end":72}},{"node":null,"pages":{"start":"51","end":"51","pdf_start":73,"pdf_end":73}},{"node":null,"pages":{"start":"52","end":"52","pdf_start":74,"pdf_end":74}}],"source_pages":["35","37","38","41","49","50","51","52"],"quote":null,"negative_result":false,"negative_results":[],"basis":"stated","confidence":"high"},{"id":"j2","role":"research","title":"Check it uses real interactions (attribution)","question":"Does PointVS base its predictions on genuine protein-ligand interactions rather than dataset patterns?","approach":"Compare edge-attention attribution (PointVS), bond masking (IGN) and atom masking (gnina) against PLIP interactions on three Tankyrase-2 complexes, and correlate attribution scores with protein-ligand distance over the PDBBind Core set and a 20-structure subset.","outcome":"worked","outcome_note":"PointVS ranked PLIP hydrogen-bond edges first and second in all three complexes but missed one halogen bond; gnina and IGN agreed much less. Author's own wording is cautious: 'at least partial agreement' (p. 34).","why_next":"If attribution finds important protein atoms in one structure, averaging over many bound fragments should expose hotspots usable as design constraints.","next":"j3","chapters":["ch2"],"nodes":["s2.4.4","s2.5.2","s2.5.2.1","s2.5.2.2"],"evidence":[{"node":null,"pages":{"start":"34","end":"34","pdf_start":56,"pdf_end":56}},{"node":null,"pages":{"start":"52","end":"52","pdf_start":74,"pdf_end":74}},{"node":null,"pages":{"start":"55","end":"55","pdf_start":77,"pdf_end":77}},{"node":null,"pages":{"start":"56","end":"56","pdf_start":78,"pdf_end":78}},{"node":null,"pages":{"start":"57","end":"57","pdf_start":79,"pdf_end":79}}],"source_pages":["34","52","55","56","57"],"quote":null,"negative_result":false,"negative_results":[],"basis":"stated","confidence":"high"},{"id":"j3","role":"research","title":"Turn hotspots into fragment elaboration","question":"Can attribution-derived hotspots from fragment screens guide fragment elaboration better than a data-driven hotspot method?","approach":"Run edge-attention attribution on bound fragment structures (Mpro 152, Mac1 58, NSP14 19), average per protein atom, feed top hotspots to STRIFE, dock elaborations with GOLD and compare standardised ligand efficiency (ΔSLE20) with Hotspots API hotspots. Controls: PLIP contact counts and random subsets of 10-80 structures. FGFR1 case study in Appendix A.4.","outcome":"worked","outcome_note":"Top-5 PointVS hotspots gave higher ΔSLE20 than top-5 API hotspots on all three targets (e.g. Mpro 0.341 vs 0.213). API hotspots ranked 6-10 scored higher, but the API could not rank its hotspots whereas PointVS ranking separated good from worse. Evaluation is by docking score only.","why_next":"Fragment-based design needs good structural and fragment data; where that is missing, or broader chemical space is wanted, de novo design with diffusion models is the next step, and its main weakness is plausibility (p. 63).","next":"j4","chapters":["ch2"],"nodes":["s2.4.5","s2.5.3","s2.5.3.1","s2.5.3.2","s2.5.4","s2.6","sA.4"],"evidence":[{"node":null,"pages":{"start":"59","end":"59","pdf_start":81,"pdf_end":81}},{"node":null,"pages":{"start":"60","end":"60","pdf_start":82,"pdf_end":82}},{"node":null,"pages":{"start":"61","end":"61","pdf_start":83,"pdf_end":83}},{"node":null,"pages":{"start":"62","end":"62","pdf_start":84,"pdf_end":84}},{"node":null,"pages":{"start":"63","end":"63","pdf_start":85,"pdf_end":85}},{"node":null,"pages":{"start":"133","end":"133","pdf_start":155,"pdf_end":155}},{"node":null,"pages":{"start":"134","end":"134","pdf_start":156,"pdf_end":156}}],"source_pages":["59","60","61","62","63","133","134"],"quote":null,"negative_result":false,"negative_results":[],"basis":"stated","confidence":"high"},{"id":"j4","role":"research","title":"Find a recipe for negative training data","question":"If distorted molecules are added to the training set as labelled negatives, how many and how distorted should they be?","approach":"Ablation with EDM on GEOM (no H): distorted:original ratios 1:20, 1:50, 1:100 and maximum distortions 0.1-1 Å; the label is the distortion D; sample at D = 0 and, for contrast, at D = Dmax (100 molecules each).","outcome":"worked","outcome_note":"Best: 1:50 with Dmax = 0.25 Å (RDKit 97%, PoseBusters 81%). Too little distortion blurs the label; too much stops the model learning subtle flaws (1:100 at 1 Å: 8%). Sampling at D = Dmax gave at most 53%, showing the label carries information.","why_next":"Apply the chosen setting (1:50, 0.25 Å) to QM9, GEOM and ZINC.","next":"j5","chapters":["ch3"],"nodes":["s3.3.2","s3.4.1","sB.1"],"evidence":[{"node":null,"pages":{"start":"72","end":"72","pdf_start":94,"pdf_end":94}},{"node":null,"pages":{"start":"76","end":"76","pdf_start":98,"pdf_end":98}},{"node":null,"pages":{"start":"77","end":"77","pdf_start":99,"pdf_end":99}},{"node":null,"pages":{"start":"78","end":"78","pdf_start":100,"pdf_end":100}},{"node":null,"pages":{"start":"137","end":"137","pdf_start":159,"pdf_end":159}}],"source_pages":["72","76","77","78","137"],"quote":null,"negative_result":false,"negative_results":[],"basis":"stated","confidence":"high"},{"id":"j5","role":"research","title":"Condition EDM on distortion across datasets","question":"Does sampling from the low-distortion region improve the physical plausibility of EDM molecules across small and drug-like datasets?","approach":"Train EDM conditionally on distorted QM9, GEOM and a ZINC subset; sample 1000 molecules at D = 0 and score with RDKit sanitisation and PoseBusters.","outcome":"worked","outcome_note":"PoseBusters pass rate rose on GEOM (62.2 to 68.8%) and ZINC (40.0 to 74.5%) but fell on QM9 (81.1 to 46.9%). The author reads this as the method helping where molecules are larger and conformational space more complex, and EDM already suiting QM9 (pp. 78-79, 84).","why_next":"Distortion distance is a crude label; test a physically grounded one, XTB internal energy.","next":"j6","chapters":["ch3"],"nodes":["s3.4","s3.4.2"],"evidence":[{"node":null,"pages":{"start":"78","end":"78","pdf_start":100,"pdf_end":100}},{"node":null,"pages":{"start":"79","end":"79","pdf_start":101,"pdf_end":101}},{"node":null,"pages":{"start":"84","end":"84","pdf_start":106,"pdf_end":106}},{"node":null,"pages":{"start":"85","end":"85","pdf_start":107,"pdf_end":107}}],"source_pages":["78","79","84","85"],"quote":null,"negative_result":true,"negative_results":[],"basis":"stated","confidence":"high"},{"id":"j6","role":"research","title":"Try internal energy as the label","question":"Would an XTB internal-energy label work better than a distance-based distortion factor?","approach":"Annotate original and distorted molecules with GFN2-xTB single-point energies, train conditionally, and sample at each dataset's lowest energy (100 molecules per model).","outcome":"partial","outcome_note":"Best single result on GEOM (RDKit 98%, PoseBusters 84% vs 90% / 70% baseline) but much worse on QM9 (19%) and slightly worse than baseline on ZINC (36% vs 40%). The thesis' explanation, offered as likely rather than shown: energies are hard to compare across different molecules (p. 81).","why_next":"Keep the simpler distance label as the main method and test whether it transfers to other generative architectures.","next":"j7","chapters":["ch3"],"nodes":["s3.4.3"],"evidence":[{"node":null,"pages":{"start":"80","end":"80","pdf_start":102,"pdf_end":102}},{"node":null,"pages":{"start":"81","end":"81","pdf_start":103,"pdf_end":103}},{"node":null,"pages":{"start":"82","end":"82","pdf_start":104,"pdf_end":104}}],"source_pages":["80","81","82"],"quote":null,"negative_result":true,"negative_results":[],"basis":"stated","confidence":"high"},{"id":"j7","role":"research","title":"Test transfer to GCDM and MolFM","question":"Does distortion conditioning work for other plausibility-oriented generators?","approach":"Apply the same conditioning to GCDM (geometry-complete diffusion) and MolFM (flow matching) on GEOM and ZINC.","outcome":"partial","outcome_note":"GCDM: large gain on ZINC (PoseBusters 40.8 to 66.5%), marginal on GEOM. MolFM: worse on GEOM (80.8 to 46.8%), slightly better on ZINC. The cause is 'unclear' (p. 83). Note: Appendix B.2's MolFM GEOM rows disagree with Table 3.5 (see anomalies).","why_next":"Having refined the training data, tackle plausibility from the generation side: build molecules from pre-validated fragments rather than atoms (p. 84).","next":"j8","chapters":["ch3"],"nodes":["s3.4.4","s3.5","sB.2","sB.3"],"evidence":[{"node":null,"pages":{"start":"82","end":"82","pdf_start":104,"pdf_end":104}},{"node":null,"pages":{"start":"83","end":"83","pdf_start":105,"pdf_end":105}},{"node":null,"pages":{"start":"84","end":"84","pdf_start":106,"pdf_end":106}},{"node":null,"pages":{"start":"85","end":"85","pdf_start":107,"pdf_end":107}},{"node":null,"pages":{"start":"138","end":"138","pdf_start":160,"pdf_end":160}}],"source_pages":["82","83","84","85","138"],"quote":null,"negative_result":true,"negative_results":[],"basis":"stated","confidence":"high"},{"id":"j8","role":"research","title":"Replace atoms with blocks: centroid-only","question":"Is placing individual atoms in 3D the reason diffusion models generate implausible molecules, and would BRICS fragment blocks (also helping synthesisability) make the task tractable?","approach":"Adapt the Ch 3 EDM so each node is a BRICS block with a centroid position and a block-type one-hot (172 types from GEOM; 56,281 molecules); rebuild atoms from an RDKit conformer per block. Test centroid-only, then a plane-alignment post-process.","outcome":"pivot","outcome_note":"Even with ground-truth blocks and centroids only 48 of 100 molecules passed RDKit, so the representation itself caps performance; the generative model reached about 4%. Plane alignment gave 10.8%, failing on inter-block connectivity.","why_next":"Orientation cannot be fixed by post-processing; it must be learned, so add explicit orientation vectors (p. 98).","next":"j9","chapters":["ch4"],"nodes":["s4.2","s4.3.1.2","s4.3.2.2","s4.4.1","s4.4.2"],"evidence":[{"node":null,"pages":{"start":"88","end":"88","pdf_start":110,"pdf_end":110}},{"node":null,"pages":{"start":"89","end":"89","pdf_start":111,"pdf_end":111}},{"node":null,"pages":{"start":"92","end":"92","pdf_start":114,"pdf_end":114}},{"node":null,"pages":{"start":"93","end":"93","pdf_start":115,"pdf_end":115}},{"node":null,"pages":{"start":"97","end":"97","pdf_start":119,"pdf_end":119}},{"node":null,"pages":{"start":"98","end":"98","pdf_start":120,"pdf_end":120}}],"source_pages":["88","89","92","93","97","98"],"quote":null,"negative_result":true,"negative_results":[],"basis":"stated","confidence":"high"},{"id":"j9","role":"research","title":"Add orientation vectors to blocks","question":"Can a richer position-plus-orientation descriptor close the gap to atomistic diffusion?","approach":"Describe each block by three 3D vectors (centroid, best-fit-plane normal, in-plane axis) and train on full BRICS (172 types) and a reduced library (23 canonical rings and atoms; 62,746 molecules).","outcome":"failed","outcome_note":"Reconstruction control rose from 48 to 89 of 100, and generation reached 27.2% (full) and 51.7% (reduced) RDKit sanitisation, but not the 84.7% of the atomistic model. The thesis diagnoses geometric variance of BRICS fragments, which blocks a consistent local frame.","why_next":"Later work (HierDiff, CMD-GEN) uses learned equivariant decoders or hierarchy and works; the thesis recommends that route and does not pursue it. The work then turns to the structure-prediction side, which the Introduction called a prerequisite for structure-based design (p. 5).","next":"j10","chapters":["ch4"],"nodes":["s4.3.2.3","s4.4.3","s4.5","s4.6"],"evidence":[{"node":null,"pages":{"start":"93","end":"93","pdf_start":115,"pdf_end":115}},{"node":null,"pages":{"start":"95","end":"95","pdf_start":117,"pdf_end":117}},{"node":null,"pages":{"start":"99","end":"99","pdf_start":121,"pdf_end":121}},{"node":null,"pages":{"start":"100","end":"100","pdf_start":122,"pdf_end":122}},{"node":null,"pages":{"start":"101","end":"101","pdf_start":123,"pdf_end":123}},{"node":null,"pages":{"start":"102","end":"102","pdf_start":124,"pdf_end":124}}],"source_pages":["93","95","99","100","101","102"],"quote":null,"negative_result":true,"negative_results":[],"basis":"stated","confidence":"high"},{"id":"j10","role":"research","title":"Condition OpenFold on a cryo-EM map","question":"Can a map-overlap gradient inside OpenFold's structure module pull a poor prediction towards the experimental density?","approach":"Simulate a density map from the prediction, take dot-product overlap with the (simulated) target map, back-propagate to coordinates, frames or single representation, and add a scaled update; test constant scaling, three decay schedules and iterative or adaptive updates on 10 monomer targets.","outcome":"pivot","outcome_note":"Gains were modest and inconsistent; frame-level conditioning did nothing at constant scaling; 7VPL and 8CXO got worse in every setting; the best scheme improved 9 of 10 targets but 'all improvements were marginal' (p. 116). Larger updates collapsed structures.","why_next":"Late intervention cannot make large rearrangements without breaking learned priors; try diffusion-based Boltz-2, which tolerates perturbation better (p. 116).","next":"j11","chapters":["ch5"],"nodes":["s5.3.1","s5.3.3","s5.4.1","s5.4.1.1","s5.4.1.2","s5.4.1.3"],"evidence":[{"node":null,"pages":{"start":"107","end":"107","pdf_start":129,"pdf_end":129}},{"node":null,"pages":{"start":"111","end":"111","pdf_start":133,"pdf_end":133}},{"node":null,"pages":{"start":"112","end":"112","pdf_start":134,"pdf_end":134}},{"node":null,"pages":{"start":"114","end":"114","pdf_start":136,"pdf_end":136}},{"node":null,"pages":{"start":"116","end":"116","pdf_start":138,"pdf_end":138}}],"source_pages":["107","111","112","114","116"],"quote":null,"negative_result":true,"negative_results":[],"basis":"stated","confidence":"high"},{"id":"j11","role":"research","title":"Move the idea to Boltz-2","question":"Does a diffusion-based predictor accept stronger map guidance without structural collapse?","approach":"Apply the same gradient-based optimisation inside the Boltz-2 structure module at each diffusion step.","outcome":"partial","outcome_note":"Large rearrangements became possible (8FEI 20.0 to 2.4 Å, 8CXO 11.7 to 7.7 Å) and 5YW7, 6LN8, 7N70 improved, but 6LLY and 7VLR got worse; the author calls it not yet reliable (p. 118).","why_next":"Inconsistency suggested that intervening late in the pipeline is insufficient; intervene earlier by subsampling MSAs, as ROCKET and CryoBoltz suggest (p. 119).","next":"j12","chapters":["ch5"],"nodes":["s5.4.2","s5.4.2.1"],"evidence":[{"node":null,"pages":{"start":"116","end":"116","pdf_start":138,"pdf_end":138}},{"node":null,"pages":{"start":"117","end":"117","pdf_start":139,"pdf_end":139}},{"node":null,"pages":{"start":"118","end":"118","pdf_start":140,"pdf_end":140}},{"node":null,"pages":{"start":"119","end":"119","pdf_start":141,"pdf_end":141}}],"source_pages":["116","117","118","119"],"quote":null,"negative_result":false,"negative_results":[],"basis":"stated","confidence":"high"},{"id":"j12","role":"research","title":"Inject stochasticity with MSA subsampling","question":"Can early stochasticity let Boltz-2 escape the local minima of its unconstrained prediction and reach conformations closer to the map?","approach":"Run five parallel Boltz-2 predictions from MSAs sampled at 8192, 4096 or 2048 sequences, prune the worst trajectory every 20 steps, with and without gradient conditioning.","outcome":"partial","outcome_note":"MSA subsampling alone helped 7VLR and 7VPL but was inconsistent. Combined with gradients it was the best approach tried, excluding 8FEI (which got worse); 2048 sequences gave the lowest RMSD on only 6 of 10 targets. All results use simulated maps and ground-truth alignment (pp. 110-111, 122).","why_next":"End of the experimental work: sample more MSAs, repeat runs, add noise injection, then drop ground-truth alignment and move to real experimental maps (p. 122).","next":"j13","chapters":["ch5"],"nodes":["s5.3.2","s5.4.2.2","s5.4.2.2~only-msa-subsampling","s5.4.2.2~combining-with-gradient-based-optimisation","s5.5"],"evidence":[{"node":null,"pages":{"start":"110","end":"110","pdf_start":132,"pdf_end":132}},{"node":null,"pages":{"start":"111","end":"111","pdf_start":133,"pdf_end":133}},{"node":null,"pages":{"start":"119","end":"119","pdf_start":141,"pdf_end":141}},{"node":null,"pages":{"start":"120","end":"120","pdf_start":142,"pdf_end":142}},{"node":null,"pages":{"start":"121","end":"121","pdf_start":143,"pdf_end":143}},{"node":null,"pages":{"start":"122","end":"122","pdf_start":144,"pdf_end":144}}],"source_pages":["110","111","119","120","121","122"],"quote":null,"negative_result":true,"negative_results":[],"basis":"stated","confidence":"high"},{"id":"j13","role":"destination","title":"Where it ends up","question":"What does it amount to?","approach":"Chapter 6 gives per-application conclusions and four lessons.","outcome":null,"outcome_note":"Chapter 6 states that none of the methods is a complete solution, but each g 112","113","114","115","116","118","120","121","122"],"basis":"stated","confidence":"high"}],"claims":[{"id":"c1","text":"Median cost of bringing a drug to market is about $1.3bn and takes over ten years on average.","node":"s1.1","stage":"j0","source_pages":["3"],"evidence_nodes":[],"evidence":null,"quote":null,"basis":"stated","confidence":"high"},{"id":"c2","text":"Lack of efficacy is the main cause of failure in over 50% of Phase II and over 60% of Phase III cases; safety accounts for about 20-25%.","node":"s1.1","stage":"j0","source_pages":["3","4"],"evidence_nodes":[],"evidence":null,"quote":null,"basis":"stated","confidence":"high"},{"id":"c3","text":"In the original DUD, 42% of actives were charged versus 15% of decoys, letting models inflate performance by labelling charged compounds active.","node":"s1.4.2","stage":"j0","source_pages":["26"],"evidence_nodes":[],"evidence":null,"quote":null,"basis":"stated","confidence":"high"},{"id":"c4","text":"Joint first-author split: Scantlebury designed PointVS and did dataset filtering and scoring-function assessment; Vost did the other attribution methods, the attribution tests and the elaboration tests.","node":"s2.2","stage":"j1","source_pages":["35"],"evidence_nodes":[],"evidence":null,"quote":null,"basis":"stated","confidence":"high"},{"id":"c5","text":"284 of 285 PDBBind Core proteins have a counterpart with ≥90% sequence similarity in the General set; 273 (95.7%) have an identical sequence.","node":"s2.5.1.1","stage":"j1","source_pages":["49"],"evidence_nodes":[],"evidence":null,"quote":null,"basis":"stated","confidence":"high"},{"id":"c6","text":"Pose ranking is barely affected by filtering: Top-1 on gninaSetPose is 70% (Redocked) and 68% (Redocked\\gninaSetPose80); gnina trained on Redocked gets 68%.","node":"s2.5.1.2","stage":"j1","source_pages":["50"],"evidence_nodes":["fig2.3"],"evidence":"Fig 2.3","quote":null,"basis":"stated","confidence":"high"},{"id":"c7","text":"Core-set Top-1 without the crystal pos ","text":"With as few as 10 bound structures the full-screen top-5 PointVS hotspots are still the most commonly picked; consistency rises with more structures (sizes 10-80, 40 random draws each).","node":"s2.5.3.2","stage":"j3","source_pages":["60"],"evidence_nodes":["fig2.6"],"evidence":"Fig 2.6","quote":null,"basis":"stated","confidence":"high"},{"id":"c14","text":"Top-5 PointVS hotspots gave higher ΔSLE20 than top-5 API hotspots on all three targets: Mpro 0.341 vs 0.213, Mac1 1.749 vs 1.581, NSP14 1.708 vs 1.240.","node":"s2.5.4","stage":"j3","source_pages":["61"],"evidence_nodes":["tab2.7"],"evidence":"Table 2.7","quote":null,"basis":"stated","confidence":"high"},{"id":"c15","text":"API hotspots ranked 6-10 had higher ΔSLE20 than PointVS 6-10 on all three targets, but PointVS ranks 1-5 beat 6-10 while the API could not rank its hotspots.","node":"s2.5.4","stage":"j3","source_pages":["61"],"evidence_nodes":["tab2.7"],"evidence":"Table 2.7","quote":null,"basis":"stated","confidence":"high"},{"id":"c16","text":"Elaborations are judged by GOLD constrained-docking score per heavy atom, standardised against the ground-truth molecule (ΔSLE20); no experimental testing is reported in the chapter.","node":"s2.4.5.5","stage":"j3","source_pages":["48"],"evidence_nodes":[],"evidence":null,"quote":null,"basis":"inferred","confidence":"medium"},{"id":"c17","text":"FGFR1 case study: PointVS ranks both hydrogen-bonding protein atoms of erdafitinib 3rd and 6th; the Hotspots API places a donor hotspot 1.5 Å from one but misses the other.","node":"sA.4","stage":"j3","source_pages":["133","134"],"evidence_nodes":[],"evidence":null,"quote":null,"basis":"stated","confidence":"high"},{"id":"c18","text":"Best ablation setting on GEOM (no H): 1 distorted per 50 originals, Dmax 0.25 Å, giving RDKit 97% and PoseBusters 81% (n = 100).","node":"s3.4.1","stage":"j4","source_pages":["77","78"],"evidence_nodes":["tab3.1"],"evidence":"Table 3.1","quote":null,"basis":"stated","confidence":"high"},{"id":"c19","text":"1:100 at Dmax = 1 Å gives PoseBusters 8%; sampling at D = Dmax yields at most 53%.","node":"s3.4.1","stage":"j4","source_pages":["78"],"evidence_nodes":["tab3.1","tabB.1"],"evidence":"Table 3.1; Table B.1","quote":null,"basis":"stated","confidence":"high"},{"id":"c20","text":"EDM PoseBusters all-tests pass rate with distortion conditioning: GEOM 62.2% to 68.8%, ZINC 40.0% to 74.5%, QM9 81.1% to 46.9%.","node":"s3.4.2","stage":"j5","source_pages":["79","85"],"evidence_nodes":["tab3.2"],"evidence":"Table 3.2","quote":null,"basis":"stated","confidence":"high"},{"id":"c21","text":"On ZINC, conditioning raised atom-connectivity pass rate from 62.4% to 95.7% and bond-length pass rate from 65.0% to 94.1%.","node":"s3.4.2","stage":"j5","source_pages":["79"],"evidence_nodes":["tab3.2"],"evidence":"Table 3.2","quote":null,"basis":"stated","confidence":"high"},{"id":"c22","text":"XTB energy labels: GEOM 70% to 84% PoseBusters, QM9 81% to 19%, ZINC 40% to 36% (n = 100).","node":"s3.4.3","stage":"j6","source_pages":["82"],"evidence_nodes":["tab3.3"],"evidence":"Table 3.3","quote":null,"basis":"stated","confidence":"high"},{"id":"c23","text":"GCDM on ZINC: PoseBusters 40.8% to 66.5%; on GEOM 77.8% to 79.7%. MolFM on GEOM: 80.8% to 46.8%; on ZINC 42.3% to 45.9%.","node":"s3.4.4","stage":"j7","source_pages":["82","83"],"evidence_nodes":["tab3.5"],"evidence":"Table 3.5","quote":null,"basis":"stated","confidence":"high"},{"id":"c24","text":"The method is strongest for diffusion models on larger drug-like molecules, limited for QM9, inconsistent for flow matching.","node":"s3.5","stage":"j7","source_pages":["84"],"evidence_nodes":[],"evidence":null,"quote":null,"basis":"stated","confidence":"high"},{"id":"c25","text":"Centroid-only control with ground-truth blocks: 48/100 pass RDKit sanitisation; the full diffusion model reaches about 4%.","node":"s4.4.1","stage":"j8","source_pages":["97","100"],"evidence_nodes":["tab4.1"],"evidence":"Table 4.1","quote":null,"basis":"stated","confidence":"high"},{"id":"c26","text":"Plane alignment post-processing gives 10.8% RDKit sanitisation, mostly failing on inter-block connectivity.","node":"s4.4.2","stage":"j8","source_pages":["98"],"evidence_nodes":["tab4.1"],"evidence":"Table 4.1","quote":null,"basis":"stated","confidence":"high"},{"id":"c27","text":"With orientation vectors the control rises to 89/100 and generation reaches 27.2% (full BRICS, 172 block types) and 51.7% (reduced library, 23 types), against 84.7% for the atomistic model.","node":"s4.4.3","stage":"j9","source_pages":["93","99","100"],"evidence_nodes":["tab4.1"],"evidence":"Table 4.1","quote":null,"basis":"stated","confidence":"high"},{"id":"c28","text":"Later work reports >94% validity for HierDiff (GEOM) and 97.5% for CMD-GEN; these metrics are not necessarily the same as RDKit sanitisation, so the comparison is indicative only.","node":"s4.5","stage":"j9","source_pages":["100","101"],"evidence_nodes":[],"evidence":null,"quote":null,"basis":"stated","confidence":"medium"},{"id":"c29","text":"OpenFold with constant scaling: modest gains for coordinates and single representation, none for frames; all conditioning worsened 7VPL and 8CXO.","node":"s5.4.1.1","stage":"j10","source_pages":["111"],"evidence_nodes":["fig5.2"],"evidence":"Fig 5.2","quote":null,"basis":"stated","confidence":"high"},{"id":"c30","text":"Best OpenFold scheme (frames, 0.1, 3, block and global) improved 9 of 10 targets but all improvements were marginal; adaptive updates cut 8FEI from 3.58 to 2.20 Å and 6LN8 from 5.25 to 4.62 Å.","node":"s5.4.1.3","stage":"j10","source_pages":["116"],"evidence_nodes":["fig5.6"],"evidence":"Fig 5.6","quote":null,"basis":"stated","confidence":"high"},{"id":"c31","text":"Boltz-2 gradient conditioning: 8FEI 20.0 to 2.4 Å and 8CXO 11.7 to 7.7 Å; worse for 6LLY and 7VLR.","node":"s5.4.2.1","stage":"j11","source_pages":["118"],"evidence_nodes":["fig5.7","tab5.1"],"evidence":"Fig 5.7; Table 5.1","quote":null,"basis":"stated","confidence":"high"},{"id":"c32","text":"MSA subsampling alone improved 7VLR and 7VPL, which gradient conditioning alone made worse; it is inconsistent, with at most five MSAs tried.","node":"s5.4.2.2~only-msa-subsampling","stage":"j12","source_pages":["119","120"],"evidence_nodes":["fig5.8"],"evidence":"Fig 5.8","quote":null,"basis":"stated","confidence":"high"},{"id":"c33","text":"Combining MSA subsampling and gradients was the best approach excluding 8FEI; 2048 sequences gave the lowest RMSD on only 6 of 10 targets.","node":"s5.4.2.2~combining-with-gradient-based-optimisation","stage":"j12","source_pages":["120","121"],"evidence_nodes":["fig5.9"],"evidence":"Fig 5.9","quote":null,"basis":"stated","confidence":"high"},{"id":"c34","text":"All Ch 5 results use simulated ideal density maps, alignment to the ground-truth structure, ten monomer targets and Cα-RMSD only.","node":"s5.3.3","stage":"j12","source_pages":["107","108","111"],"evidence_nodes":["tab5.1"],"evidence":"Table 5.1","quote":null,"basis":"stated","confidence":"high"},{"id":"c35","text":"With currently available datasets it is impossible to train scoring functions entirely free from bias; large, consistently modelled public protein-ligand datasets are needed.","node":"s6.1","stage":"j13","source_pages":["124"],"evidence_nodes":[],"evidence":null,"quote":null,"basis":"stated","confidence":"high"},{"id":"c36","text":"Four lessons: interpretability, negative data, block-encoding difficulty, early intervention plus stochasticity for guiding AlphaFold-like predictors.","node":"s6.4","stage":"j13","source_pages":["126"],"evidence_nodes":[],"evidence":null,"quote":null,"basis":"stated","confidence":"high"}],"edge_types":{"answers_limitation":{"label":"answers limitation","family":"flow"},"builds_on":{"label":"builds on","family":"reuse"},"motivates":{"label":"motivates","family":"flow"},"refers_to_appendix":{"label":"refers to appendix","family":"ref"},"refers_to_chapter":{"label":"refers to chapter","family":"ref"},"refers_to_equation":{"label":"refers to equation","family":"ref"},"refers_to_figure":{"label":"refers to figure","family":"ref"},"refers_to_section":{"label":"refers to section","family":"ref"},"refers_to_table":{"label":"refers to table","family":"ref"},"reuses_method":{"label":"reuses method","family":"reuse"},"same_concept":{"label":"same concept","family":"reuse"},"same_dataset":{"label":"same dataset","family":"reuse"}}},"quality":{"observations":[{"id":"a1","kind":"source anomaly","text":"Text says the 20 PDBBind Core structures were 'used in section 3.4.2'; Table 2.5 caption (p. 57) and section 2.5.2.2 (p. 57) give Appendix A.3 for those IDs, so 2.5.2.2 is almost certainly meant. The extracted cross-reference is kept but flagged low confidence.","where":"Appendix A.3 (p. 133)","source_pages":["57","133"]},{"id":"a2","kind":"source anomaly","text":"The same paragraph lists 28 PDB IDs while the text says 20 structures.","where":"Appendix A.3 (p. 133)","source_pages":["133"]},{"id":"a3","kind":"source anomaly","text":"Text says attribution was run on 18 FGFR1 structures; 16 PDB codes are listed.","where":"Appendix A.4 (pp. 133-134)","source_pages":["133","134"]},{"id":"a4","kind":"source anomaly","text":"Text refers to 'Tables 3.4a and 3.4b'; the only caption is Table 3.5 (a) GCDM, (b) MolFM. No Table 3.4 exists.","where":"Section 3.4.4 (p. 82) vs Table 3.5","source_pages":["82"]},{"id":"a5","kind":"source anomaly","text":"Appendix B.2's MolFM GEOM baseline row is identical to its GCDM GEOM baseline row (PoseBusters 77.8%), and the MolFM conditioned row (78.7%) is close to GCDM's (79.7%), while Table 3.5(b) gives MolFM GEOM 80.8% baseline and 46.8% conditioned. The chapter-3 text (p. 83) matches Table 3.5, so the appendix rows look mislabelled or copied. Treat MolFM GEOM numbers from the main text.","where":"Appendix B.2 (p. 138) vs Table 3.5 (p. 82)","source_pages":["82","83","138"]},{"id":"a6","kind":"source anomaly","text":"Refers to 'Table 1' for the 10.8% result; the captioned table is Table 4.1 (p. 100).","where":"Section 4.4.2 (p. 98)","source_pages":["98","100"]},{"id":"a7","kind":"source anomaly","text":"Table 2.6 is cited in the Methods but appears in the Results (p. 61).","where":"Section 2.4.5.4 (p. 47)","source_pages":["47","61"]},{"id":"a8","kind":"source anomaly","text":"The full PoseBusters table has no caption or number, so it is not counted as a numbered table; it is counted manually as one uncaptioned table.","where":"Appendix B.2 (p. 137-138)","source_pages":["138"]},{"id":"a9","kind":"source anomaly","text":"PDF index 1 is the cover and index 2 is an unnumbered page repeating the abstract; neither has a printed page number and neither is mapped to a printed page.","where":"PDF pages 1-2","source_pages":[]}],"coverage":{"nodes":191,"node_kinds":{"chapter":6,"section":116,"run-in":13,"appendix":2,"front":8,"back":1,"part":1,"figure":26,"table":18},"summaries":191,"quotes":77,"stages":14,"research_stages":12,"claims":36,"edges":109,"edge_kinds":{"explicit":77,"semantic":32},"entities":55,"observations":9,"source_token_checks":28,"verified_quotes":77},"validation":{"failures":[],"warnings":[]}}}</script>
<script>
(function(){
"use strict";
const D=JSON.parse(document.getElementById('thesis-data').textContent);
const NODES=D.structure.nodes, ROOTS=D.structure.roots, EDGES=D.links.edges, ENTS=D.links.entities, CLAIMS=D.links.claims;
const J=D.journey, ALLSTAGES=J.stages, STAGES=ALLSTAGES.filter(s=>s.role==='research');
const OBS=D.quality.observations, OBY=Object.fromEntries(OBS.map(o=>[o.id,o]));
const SBY=Object.fromEntries(ALLSTAGES.map(s=>[s.id,s]));
const EBY=Object.fromEntries(EDGES.map(e=>[e.id,e]));
const ENTBY=Object.fromEntries(ENTS.map(e=>[e.id,e]));
const CBY=Object.fromEntries(CLAIMS.map(c=>[c.id,c]));

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else e.setAttribute(k,v);}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(k));}return e;}
const NS='http://www.w3.org/2000/svg';
function s(tag,attrs,...kids){const e=document.createElementNS(NS,tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(v==null||v===false)continue;if(k==='class')e.setAttribute('class',v);else e.setAttribute(k,v);}for(const k of kids.flat()){if(k==null)continue;e.append(k.nodeType?k:document.createTextNode(k));}return e;}
const PAGEBY=Object.fromEntries(D.pagemap.pages.filter(p=>p.label!==null).map(p=>[p.label,p]));
const pdfIdx=p=>PAGEBY[p].pdf_index;
function runs(list){const u=[...new Set(list)].sort((a,b)=>pdfIdx(a)-pdfIdx(b));const out=[];let i=0;while(i<u.length){let j=i;while(j+1<u.length&&pdfIdx(u[j+1])===pdfIdx(u[j])+1&&/^\d+$/.test(u[j])&&/^\d+$/.test(u[j+1]))j++;out.push(j>i?[u[i],u[j]]:[u[i]]);i=j+1;}return out;}
function pgChips(list){return runs(list).map(r=>h('span',{class:'pg',title:r.map(p=>`PDF page ${pdfIdx(p)} · ${PAGEBY[p].status}`).join(' to ')},r.length>1?`pp. ${r[0]}–${r[1]}`:`p. ${r[0]}`));}
function pgRange(a,b){return h('span',{class:'pg'},a===b?`p. ${a}`:`pp. ${a}–${b}`);}
const pgText=(a,b)=>a===b?`p. ${a}`:`pp. ${a}–${b}`;
const N=id=>NODES[id];
const isLeaf=n=>n&&['figure','table'].includes(n.kind);
const leafChildren=n=>n.children.filter(id=>isLeaf(N(id)));
const visibleChildren=n=>n.children.filter(id=>showLeaves||!isLeaf(N(id)));
const stageLabel=s=>s.role==='origin'?'Start':s.role==='destination'?'End':s.id.toUpperCase();
function anc(id){const o=[];let p=N(id)&&N(id).parent;while(p){o.push(p);p=N(p).parent;}return o;}
function desc(id,acc=new Set()){const n=N(id);for(const c of n.children){acc.add(c);desc(c,acc);}return acc;}
function chapterOf(id){const a=[id,...anc(id)];return a.find(x=>['chapter','appendix'].includes(N(x).kind))||a[a.length-1];}
const label=n=>n.number&&!isLeaf(n)?`${/^[A-Z]/.test(n.number)||n.level>0?'§':''}${n.number}`:'';
function nodeName(id){const n=N(id);if(!n)return id;if(n.kind==='chapter')return `Ch ${n.number} · ${n.title}`;if(n.kind==='appendix')return `Appendix ${n.number} · ${n.title}`;if(n.kind==='figure'||n.kind==='table')return n.title;return `${n.number?(/^\d/.test(n.number)?'§':'')+n.number+' ':''}${n.title}`;}
function shortName(id){const n=N(id);if(n.kind==='chapter')return `Ch ${n.number}`;if(n.kind==='appendix')return `App ${n.number}`;if(n.kind==='figure')return `Fig ${n.number}`;if(n.kind==='table')return `Tab ${n.number}`;return n.number?(/^\d/.test(n.number)?'§':'')+n.number:n.title;}
const TYPEDOT=t=>h('span',{class:'dot',style:`background:var(--t-${t==='front-matter'||t==='references'?'front':t})`});
const OUTCOLOR={worked:'--worked',partial:'--partial',failed:'--failed',pivot:'--pivot'};
const OUTLABEL={worked:'Worked',partial:'Partial',failed:'Failed',pivot:'Pivot'};
function marker(outcome,size=24){
  if(!outcome)return s('svg',{viewBox:'0 0 24 24',width:size,height:size,'aria-hidden':'true'},s('path',{d:'M6 22V3L19 7L6 12',fill:'none',stroke:'currentColor','stroke-width':2}));
  const c=`var(${OUTCOLOR[outcome]})`, st='stroke="var(--ink)" stroke-width="1.6"';
  const shapes={
   worked:`<circle cx="12" cy="12" r="9.5" fill="${c}" ${st}/><path d="M7.5 12.4l3 3 6-6.4" fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`,
   partial:`<circle cx="12" cy="12" r="9.5" fill="var(--surface)" ${st}/><path d="M12 2.5a9.5 9.5 0 0 0 0 19z" fill="${c}"/><circle cx="12" cy="12" r="9.5" fill="none" ${st}/>`,
   failed:`<rect x="2.5" y="2.5" width="19" height="19" rx="2" fill="${c}" ${st}/><path d="M8 8l8 8M16 8l-8 8" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>`,
   pivot:`<path d="M12 1.8l10.2 10.2L12 22.2 1.8 12z" fill="${c}" ${st} stroke-linejoin="round"/><path d="M8.2 14.2V11a2.2 2.2 0 0 1 2.2-2.2h5M13.4 6.4l2.8 2.4-2.8 2.4" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`};
  const sv=s('svg',{viewBox:'0 0 24 24',width:size,height:size,'aria-hidden':'true',focusable:'false'});sv.innerHTML=shapes[outcome];return sv;
}
const FAM=Object.fromEntries(Object.entries(D.links.edge_types).map(([k,v])=>[k,v.family]));
const TYPELABEL=Object.fromEntries(Object.entries(D.links.edge_types).map(([k,v])=>[k,v.label]));
const LEAFTYPES=new Set(['refers_to_figure','refers_to_table']);
const CATEGORIES=[...new Set(ENTS.map(e=>e.category))];

/* ---------- state ---------- */
const state={tab:'journey',sel:null,hl:{nodes:new Set(),stages:new Set(),ents:new Set(),edges:new Set()}};
const expanded=new Set();
let sizeBy='words',showLeaves=true,focusChapter=null;

function computeHL(){
  const hl={nodes:new Set(),stages:new Set(),ents:new Set(),edges:new Set()};const sel=state.sel;state.hl=hl;if(!sel)return;
  const addNode=(id,withDesc)=>{if(!N(id))return;hl.nodes.add(id);anc(id).forEach(a=>hl.nodes.add(a));if(withDesc)desc(id).forEach(d=>hl.nodes.add(d));};
  const stagesFor=ids=>{for(const st of ALLSTAGES){const items=[...st.nodes,...st.chapters.filter(c=>ids.includes(c))];if(items.some(x=>ids.some(n=>n===x||anc(x).includes(n)||anc(n).includes(x))))hl.stages.add(st.id);}};
  if(sel.kind==='node'){addNode(sel.id,true);stagesFor([sel.id]);ENTS.forEach(e=>{if(e.first_node===sel.id)hl.ents.add(e.id);});}
  else if(sel.kind==='stage'){const st=SBY[sel.id];hl.stages.add(sel.id);[...st.nodes,...st.chapters].forEach(x=>addNode(x,false));}
  else if(sel.kind==='entity'){const e=ENTBY[sel.id];hl.ents.add(sel.id);Object.keys(e.chapters).forEach(c=>addNode(c,false));if(e.first_node)addNode(e.first_node,false);}
  else if(sel.kind==='claim'){const c=CBY[sel.id];addNode(c.node,false);(c.evidence_nodes||[]).forEach(x=>addNode(x,false));hl.stages.add(c.stage);}
  else if(sel.kind==='edge'){const e=EBY[sel.id]||sel.edge;if(e){addNode(e.source,false);addNode(e.target,false);hl.edges.add(e.id);}}
}

/* ---------- selection / navigation ---------- */
function select(sel,opts={}){
  state.sel=sel;computeHL();
  if(sel&&sel.kind==='node')revealNode(sel.id);
  else if(sel&&sel.kind==='stage'){SBY[sel.id].nodes.forEach(revealNode);focusChapter=SBY[sel.id].chapters[0];}
  else if(sel&&sel.kind==='claim'){revealNode(CBY[sel.id].node);}
  else if(sel&&sel.kind==='entity'&&ENTBY[sel.id].first_node)revealNode(ENTBY[sel.id].first_node);
  document.body.classList.toggle('has-sel',!!sel);
  applyHL();renderPanel();
  if(opts.tab)setTab(opts.tab,{keep:true});
  writeHash();
  if(opts.scroll!==false)scrollToSel();
}
function clearSel(){select(null,{scroll:false});}
function setTab(t,o={}){
  state.tab=t;
  $$('.tab').forEach(b=>{const on=b.dataset.tab===t;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;});
  $$('.view').forEach(v=>v.hidden=v.id!=='v-'+t);
  writeHash();
  if(t==='links')layoutGraph(true);
  if(t==='structure'){renderStructure();}
  if(!o.keep)scrollToSel();
}
function scrollToSel(){
  requestAnimationFrame(()=>{
    const sel=state.sel;if(!sel)return;
    let el=null;

  if(cited.length)b.append(sec('Evidence spans',h('ul',{class:'plain'},cited.map(e=>h('li',null,nodeBtn(e.node),' ',pgRange(e.pages.start,e.pages.end))))));

  P.append(panelHead(isStage?'Journey stage':st.role==='origin'?'Journey start':'Journey end'),b);
}
function panelNode(P,id){
  const n=N(id);const b=h('div',{class:'pb'});
  b.append(h('h2',null,nodeName(id)));
  b.append(h('div',{class:'chips'},pgRange(n.pages.start,n.pages.end),!isLeaf(n)?h('span',{class:'tag'},TYPEDOT(n.type),n.type):h('span',{class:'tag'},n.kind),
    !isLeaf(n)?h('span',{class:'tag'},`≈${n.approx_words.toLocaleString()} words`):null,n.n_figures?h('span',{class:'tag'},n.n_figures+' fig'):null,n.n_tables?h('span',{class:'tag'},n.n_tables+' tab'):null,
    h('span',{class:'tag'},n.basis,n.confidence?' · '+n.confidence:'')));
  if(n.summary)b.append(sec('Summary',h('p',null,n.summary)));
  if(n.quote)b.append(sec('In the thesis',h('q',null,'“'+n.quote.text+'”'),h('div',{class:'chips'},pgChips([n.quote.page]))));
  if(n.template)b.append(sec('Chapter template',h('p',null,n.template.join(' → '))));
  if(n.publication_status)b.append(sec('Publication status',h('p',null,n.publication_status),n.publication&&n.publication.note?h('p',null,n.publication.note):null));
  if(n.journal_pages)b.append(sec('Journal pagination',h('p',null,`Chem. Sci. ${n.journal_pages}; thesis page ${n.pages.start}`)));
  if(n.annotations.also)b.append(sec('Also contains',h('p',null,n.annotations.also.join(', '))));
  if(n.annotations.type_note)b.append(sec('Classification note',h('p',null,n.annotations.type_note)));
  if(n.collaboration)b.append(sec('Collaboration',h('p',null,n.collaboration)));
  // stages
  const stIds=[...state.hl.stages];if(stIds.length)b.append(sec('Journey stages',h('div',{class:'chips'},stIds.map(sid=>h('button',{class:'btn',type:'button',onclick:()=>select({kind:'stage',id:sid},{tab:'journey'})},h('span',{style:'display:inline-flex;gap:6px;align-items:center'},marker(SBY[sid].outcome,16),sid.toUpperCase()))))));
  // claims
  const sub=new Set([id,...desc(id)]);const cl=CLAIMS.filter(c=>sub.has(c.node)||(c.evidence_nodes||[]).includes(id));
  if(cl.length)b.append(sec(`Claims (${cl.length})`,h('div',{style:'display:flex;flex-direction:column;gap:8px'},cl.map(claimItem))));
  // figures/tables
  const lc=leafChildren(n);if(lc.length)b.append(sec('Figures and tables',h('ul',{class:'plain'},lc.map(l=>h('li',null,nodeBtn(l,N(l).title),' ',pgChips([N(l).pages.start]))))));
  // entities
  const key=ENTS.some(e=>Object.hasOwn(e.chapters,id))?id:null;
  let ents=key?ENTS.filter(e=>e.chapters[key]).sort((a,b)=>b.chapters[key].count-a.chapters[key].count).slice(0,14):ENTS.filter(e=>e.first_node===id);
  if(ents.length)b.append(sec(key?'Most mentioned entities here':'Entities first appearing here',h('div',{class:'chips'},ents.map(e=>h('button',{class:'btn',type:'button',onclick:()=>select({kind:'entity',id:e.id},{tab:'links'})},h('span',{style:'display:inline-flex;gap:6px;align-items:center'},entShape(e.category,12),e.name,key&&e.chapters[key].count!==null?` ${e.chapters[key].count}`:''))))));
  // connections
  const mine=EDGES.filter(e=>e.source===id||e.target===id||(n.kind!=='leaf'&&(e.source===id||e.target===id)));
  const subEdges=n.level<=1&&!isLeaf(n)?EDGES.filter(e=>(sub.has(e.source)||sub.has(e.target))&&!(sub.has(e.source)&&sub.has(e.target))&&!mine.includes(e)):[];
  const all=[...mine,...subEdges];
  if(all.length)b.append(sec(`Connections (${all.length})`,h('div',{style:'display:flex;flex-direction:column;gap:8px'},all.slice(0,16).map(e=>edgeItem(e,sub.has(e.source)?(mine.includes(e)?id:e.source):e.target))),all.length>16?h('p',{class:'muted'},`+${all.length-16} more in the Links view list.`):null));
  // tree context
  if(n.parent)b.append(sec('Inside',nodeBtn(n.parent)));
  if(n.children.length)b.append(sec(`Contains (${n.children.length})`,h('ul',{class:'plain'},n.children.map(c=>h('li',null,nodeBtn(c,(N(c).number?N(c).number+' ':'')+N(c).title),' ',pgRange(N(c).pages.start,N(c).pages.end))))));
  const links=h('div',{class:'chips'},h('button',{class:'btn',type:'button',onclick:()=>setTab('structure')},'Show in Structure'),h('button',{class:'btn',type:'button',onclick:()=>setTab('links')},'Show in Links'),h('button',{class:'btn',type:'button',onclick:()=>setTab('journey')},'Show in Journey'));
  b.append(links);
  P.append(panelHead(isLeaf(n)?n.kind:n.kind==='chapter'?'Chapter':'Section'),b);
}
function panelEntity(P,id){
  const e=ENTBY[id];const b=h('div',{class:'pb'});
  b.append(h('h2',null,e.name),h('div',{class:'chips'},h('span',{class:'tag'},entShape(e.category,12),e.category),h('span',{class:'tag'},e.total_mentions+' mentions'),h('span',{class:'tag'},e.basis,' · ',e.confidence)));
  b.append(sec('What it is',h('p',null,e.description)));
  b.append(sec('Where it appears',h('ul',{class:'plain'},Object.entries(e.chapters).map(([c,v])=>h('li',null,h('div',{class:'item'},h('div',null,nodeBtn(c),v.count===null?'':` · ${v.count}×`),h('div',{class:'chips'},pgChips(v.pages))))))));
  if(e.first_node)b.append(sec('First appears in',nodeBtn(e.first_node)));
  const cl=CLAIMS.filter(c=>c.text.toLowerCase().includes(e.name.toLowerCase().split(' / ')[0].split(' (')[0]));if(cl.length)b.append(sec('Claims that mention it',h('div',{style:'display:flex;flex-direction:column;gap:8px'},cl.slice(0,5).map(claimItem))));
  P.append(panelHead('Entity'),b);
}
function panelClaim(P,id){const c=CBY[id];const b=h('div',{class:'pb'});b.append(h('h2',null,'Claim'),claimItem(c),sec('Section',nodeBtn(c.node)),sec('Stage',h('button',{class:'linkbtn',type:'button',onclick:()=>select({kind:'stage',id:c.stage},{tab:'journey'})},SBY[c.stage].title)));P.append(panelHead('Claim'),b);}
function panelEdge(P,id){
  const e=EBY[id];const b=h('div',{class:'pb'});
  b.append(h('h2',null,`${shortName(e.source)} → ${shortName(e.target)}`),
    h('div',{class:'chips'},h('span',{class:'tag'},TYPELABEL[e.type]),h('span',{class:'tag'},h('span',{class:'sw'+(e.basis==='inferred'?' dash':'')}),e.basis),h('span',{class:'tag'},e.kind),h('span',{class:'tag'},e.confidence+' confidence')));
  b.append(sec('From',nodeBtn(e.source)),sec('To',nodeBtn(e.target)),sec('Reason',h('p',null,e.reason)),sec('Pages',h('div',{class:'chips'},pgChips(e.source_pages))));
  if(e.occurrences)b.append(sec('Where it is cited',h('ul',{class:'plain'},e.occurrences.slice(0,6).map(o=>h('li',null,h('div',{class:'item'},h('div',{class:'chips'},pgChips([o.page]),h('span',{class:'tag'},o.label)),h('div',{class:'muted'},'…'+o.text+'…')))))));
  P.append(panelHead('Connection'),b);
}
function panelObservation(P,id){const o=OBY[id];P.append(panelHead('Source observation'),h('div',{class:'pb'},h('h2',null,o.kind),h('p',null,o.text),o.where?h('p',{class:'muted'},o.where):null,h('div',{class:'chips'},pgChips(o.source_pages))));}
function writeHash(){try{const p=new URLSearchParams({tab:state.tab});if(state.sel&&state.sel.kind!=='edgegroup'){p.set('kind',state.sel.kind);p.set('id',state.sel.id);}history.replaceState(null,'','#'+p.toString());}catch(e){}}
function readHash(){const raw=location.hash.slice(1);if(['journey','structure','links'].includes(raw))return {tab:raw};const p=new URLSearchParams(raw),tab=p.get('tab');const kind=p.get('kind'),id=p.get('id'),sets={node:NODES,stage:SBY,claim:CBY,entity:ENTBY,edge:EBY,observation:OBY};return {tab:['journey','structure','links'].includes(tab)?tab:'journey',sel:sets[kind]&&Object.hasOwn(sets[kind],id)?{kind,id}:null};}
function panelGroup(P,g){const b=h('div',{class:'pb'});b.append(h('h2',null,`${shortName(g.a)} → ${shortName(g.b)}`),h('p',{class:'muted'},`${g.edges.length} ${g.basis} connections between these two nodes`),h('div',{style:'display:flex;flex-direction:column;gap:8px'},g.edges.map(e=>edgeItem(e))));P.append(panelHead('Connections'),b);}

/* =====================================================  SEARCH  */
const INDEX=[];
Object.values(NODES).forEach(n=>INDEX.push({kind:'node',id:n.id,label:nodeName(n.id),text:(nodeName(n.id)+' '+(n.summary||'')).toLowerCase(),sub:pgText(n.pages.start,n.pages.end)+' · '+(isLeaf(n)?n.kind:n.type)}));
ENTS.forEach(e=>INDEX.push({kind:'entity',id:e.id,label:e.name,text:(e.name+' '+e.description).toLowerCase(),sub:e.category+' · '+e.total_mentions+' mentions'}));
CLAIMS.forEach(c=>INDEX.push({kind:'claim',id:c.id,label:c.text.length>110?c.text.slice(0,108)+'…':c.text,text:c.text.toLowerCase(),sub:pgText(c.source_pages[0],c.source_pages[c.source_pages.length-1])+' · '+(stageLabel(SBY[c.stage]))}));
ALLSTAGES.forEach(st=>INDEX.push({kind:'stage',id:st.id,label:st.title,text:(st.title+' '+st.question+' '+(st.approach||'')).toLowerCase(),sub:'journey stage'}));
OBS.forEach(o=>INDEX.push({kind:'observation',id:o.id,label:o.text,text:o.text.toLowerCase(),sub:o.kind}));
const KLAB={node:'Section',entity:'Entity',claim:'Claim',stage:'Stage',observation:'Source observation'};
const qi=$('#q'),rs=$('#results');let ritems=[],ridx=-1;
function doSearch(){
  const q=qi.value.trim().toLowerCase();if(!q){rs.hidden=true;qi.setAttribute('aria-expanded','false');return;}
  const toks=q.split(/\s+/);
  const hits=INDEX.filter(x=>toks.every(t=>x.text.includes(t))).map(x=>({x,r:x.label.toLowerCase().startsWith(q)?0:x.label.toLowerCase().includes(q)?1:2})).sort((a,b)=>a.r-b.r||({stage:0,entity:1,node:2,claim:3,observation:4}[a.x.kind]-{stage:0,entity:1,node:2,claim:3,observation:4}[b.x.kind])).slice(0,14).map(o=>o.x);
  ritems=hits;ridx=hits.length?0:-1;rs.innerHTML='';
  if(!hits.length)rs.append(h('div',{class:'res muted'},'No matches'));
  hits.forEach((x,i)=>rs.append(h('button',{class:'res',type:'button',role:'option',id:'r'+i,'aria-selected':String(i===0),onclick:()=>pick(x)},h('span',{class:'k'},KLAB[x.kind]),h('span',{class:'t'},x.label,h('span',{class:'s'},x.sub)))));
  rs.hidden=false;qi.setAttribute('aria-expanded','true');
}
function pick(x){rs.hidden=true;qi.setAttribute('aria-expanded','false');qi.blur();
  if(x.kind==='node')select({kind:'node',id:x.id},{tab:isLeaf(N(x.id))?'structure':state.tab==='links'?'links':'structure'});
  else if(x.kind==='stage')select({kind:'stage',id:x.id},{tab:'journey'});
  else if(x.kind==='entity'){L.ent=true;L.entShared=false;syncCtl();select({kind:'entity',id:x.id},{tab:'links'});layoutGraph(true,true);}
  else if(x.kind==='observation')select({kind:'observation',id:x.id});
  else select({kind:'claim',id:x.id},{tab:'journey'});}
qi.addEventListener('input',doSearch);
qi.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!ritems.length)return;e.preventDefault();ridx=(ridx+(e.key==='ArrowDown'?1:-1)+ritems.length)%ritems.length;$$('.res',rs).forEach((b,i)=>b.setAttribute('aria-selected',String(i===ridx)));const el=$$('.res',rs)[ridx];if(el){qi.setAttribute('aria-activedescendant',el.id);el.scrollIntoView({block:'nearest'});}}
  else if(e.key==='Enter'){if(ridx>=0)pick(ritems[ridx]);}
  else if(e.key==='Escape'){rs.hidden=true;qi.setAttribute('aria-expanded','false');}
});
document.addEventListener('click',e=>{if(!e.target.closest('.search')){rs.hidden=true;qi.setAttribute('aria-expanded','false');}});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();qi.focus();}
  else if(e.key==='Escape'&&document.activeElement!==qi&&state.sel){clearSel();}
});

/* =====================================================  TABS / BOOT  */
$$('.tab').forEach(b=>{b.addEventListener('click',()=>setTab(b.dataset.tab));b.addEventListener('keydown',e=>{const t=$$('.tab');const i=t.indexOf(b);if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const n=t[(i+(e.key==='ArrowRight'?1:-1)+t.length)%t.length];n.focus();setTab(n.dataset.tab);}});});
window.addEventListener('hashchange',()=>{const saved=readHash();setTab(saved.tab,{keep:true});select(saved.sel||null,{scroll:false});});
renderJourney();renderLinks();
const saved=readHash();
renderPanel();setTab(saved.tab,{keep:true});if(saved.sel)select(saved.sel,{scroll:false});
window.__thesisMap={state,select,setTab,L,N};
})();
