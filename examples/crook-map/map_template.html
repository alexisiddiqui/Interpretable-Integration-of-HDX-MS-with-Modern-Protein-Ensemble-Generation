<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thesis map: Bayesian methods for spatial proteomics</title>
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface2:#efede7; --ink:#1d2229; --muted:#59626e; --line:#c9c5ba; --accent:#0b5cad; --focus:#0b5cad;
  --o-worked:#007a5a; --o-partial:#b36b00; --o-failed:#c2410c; --o-pivot:#0b5cad;
  --t-background:#5f7390; --t-method:#2f6fa6; --t-result:#2d8a6a; --t-discussion:#a8741f; --t-appendix:#7d5ba6; --t-front:#80808a; --t-back:#8f8f8f;
  --x-xref:#6c7a89; --x-method:#0072b2; --x-build:#c27c00; --x-share:#00875f; --x-compare:#a8467f; --x-summ:#7a7a7a; --x-mention:#9aa0a8;
  --shadow:0 1px 2px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171b; --surface:#1d2127; --surface2:#262b33; --ink:#e8e9ec; --muted:#a3abb7; --line:#3a414b; --accent:#6db0f2; --focus:#8cc4ff;
    --o-worked:#3ecf9f; --o-partial:#f0b24a; --o-failed:#ff8a5c; --o-pivot:#74b4ff;
    --t-background:#8fa3c0; --t-method:#6aa5da; --t-result:#5ec9a1; --t-discussion:#e0b062; --t-appendix:#b69ae0; --t-front:#a0a0aa; --t-back:#a8a8a8;
    --x-xref:#9aa7b5; --x-method:#56b4e9; --x-build:#f0b24a; --x-share:#3ecf9f; --x-compare:#e48ab9; --x-summ:#a0a0a0; --x-mention:#6d7580;
    --shadow:0 1px 2px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#14171b; --surface:#1d2127; --surface2:#262b33; --ink:#e8e9ec; --muted:#a3abb7; --line:#3a414b; --accent:#6db0f2; --focus:#8cc4ff;
  --o-worked:#3ecf9f; --o-partial:#f0b24a; --o-failed:#ff8a5c; --o-pivot:#74b4ff;
  --t-background:#8fa3c0; --t-method:#6aa5da; --t-result:#5ec9a1; --t-discussion:#e0b062; --t-appendix:#b69ae0; --t-front:#a0a0aa; --t-back:#a8a8a8;
  --x-xref:#9aa7b5; --x-method:#56b4e9; --x-build:#f0b24a; --x-share:#3ecf9f; --x-compare:#e48ab9; --x-summ:#a0a0a0; --x-mention:#6d7580;
  --shadow:0 1px 2px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px;max-width:1500px;margin:0 auto}
.brand{min-width:0;flex:1 1 220px}
.brand h1{font-size:16px;line-height:1.25;margin:0}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;order:3;flex:1 1 100%}
.tabs button{flex:1 1 0;padding:8px 10px;border:1px solid var(--line);background:var(--surface2);border-radius:8px 8px 0 0;font-weight:600;min-height:40px}
.tabs button[aria-selected="true"]{background:var(--surface);border-bottom-color:var(--surface);color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.tabs .sub{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.searchwrap{position:relative;flex:1 1 260px;max-width:480px}
.searchwrap input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;min-height:40px}
.results{position:absolute;left:0;right:0;top:46px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-height:60vh;overflow:auto;z-index:40;padding:4px;margin:0;list-style:none}
.results li{padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.results li[aria-selected="true"],.results li:hover{background:var(--surface2)}
.results .grp{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:6px 8px 2px;cursor:default}
.results .grp:hover{background:none}
.results .rt{flex:1 1 200px;min-width:0}
.iconbtn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:6px 10px;min-height:40px}
main{max-width:1500px;margin:0 auto;padding:12px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:1050px){ main{grid-template-columns:minmax(0,1fr) 400px} }
.view{min-width:0}
.view[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.pad{padding:12px 14px}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:15px;margin:0}
.muted{color:var(--muted)}
.small{font-size:12px}
.lead{margin:0 0 8px;max-width:78ch}
/* chips */
.chip,.pg,.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-size:12px;line-height:1.6;white-space:nowrap;color:var(--ink)}
button.chip{min-height:24px}
button.chip:hover{border-color:var(--accent)}
.pg{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:transparent}
.tag.stated{border-style:solid}
.tag.inferred{border-style:dashed}
.chips{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c,gray)}
/* journey */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:6px 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.strip-wrap{position:relative}
.strip-ctl{display:flex;gap:6px;justify-content:flex-end;margin:0 0 6px}
ol.strip{list-style:none;margin:0;padding:0 0 10px;display:flex;gap:0;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:thin;overscroll-behavior-x:contain}
.stage{position:relative;flex:0 0 272px;padding:50px 8px 4px;scroll-snap-align:start;min-width:0}
.stage::before{content:"";position:absolute;top:22px;left:0;right:0;height:3px;background:var(--line)}
.stage:first-child::before{left:36px}.stage:last-child::before{right:calc(100% - 36px)}
.marker{position:absolute;top:2px;left:8px;width:42px;height:42px;display:grid;place-items:center}
.marker svg{width:42px;height:42px;overflow:visible}
.marker .shape{fill:color-mix(in srgb,var(--oc) 20%,var(--surface));stroke:var(--oc);stroke-width:2.5}
.marker .glyph{stroke:var(--oc);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.marker .num{position:absolute;right:-6px;bottom:-4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;font-size:11px;min-width:20px;text-align:center;line-height:18px;font-weight:700}
.scard{position:relative;height:100%;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--oc);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;margin-right:12px}
.scard h3{font-size:15px;line-height:1.3}
.scard h3 button{all:unset;cursor:pointer}
.scard h3 button::after{content:"";position:absolute;inset:0;border-radius:10px}
.scard h3 button:focus-visible::after{outline:3px solid var(--focus);outline-offset:2px}
.scard .q{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.scard .row{position:relative;z-index:2}
.stage.hi .scard{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 55%,transparent)}
.stage.sel .scard{box-shadow:0 0 0 3px var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.otag{font-weight:700;font-size:12.5px;color:var(--oc);display:inline-flex;gap:5px;align-items:center}
.stage[data-o="worked"]{--oc:var(--o-worked)}.stage[data-o="partial"]{--oc:var(--o-partial)}.stage[data-o="failed"]{--oc:var(--o-failed)}.stage[data-o="pivot"]{--oc:var(--o-pivot)}
.negbadge{font-size:12px;color:var(--o-failed);font-weight:600}
@media (max-width:760px){
  ol.strip{flex-direction:column;overflow:visible}
  .stage{flex:1 1 auto;padding:0 0 12px 62px;scroll-snap-align:none}
  .stage::before{top:0;bottom:0;left:21px;right:auto;width:3px;height:auto}
  .stage:first-child::before{top:20px;left:21px}.stage:last-child::before{bottom:calc(100% - 22px);right:auto}
  .marker{left:0;top:0}
  .scard{margin-right:0}
  .strip-ctl{display:none}
}
details.box{margin:10px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.box>summary{padding:10px 14px;cursor:pointer;font-weight:600}
details.box>div{padding:0 14px 12px}
ul.plain{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.plain li{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
/* structure */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:0 0 8px}
.toolbar label{font-size:13px;display:inline-flex;gap:5px;align-items:center}
.toolbar select,.toolbar input[type=number]{font:inherit;padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.crumbs{display:flex;flex-wrap:wrap;gap:2px;align-items:center;font-size:13px;margin:4px 0 8px}
.crumbs button{border:0;background:none;color:var(--accent);padding:2px 4px;text-decoration:underline}
.ice{position:relative;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.bar{position:absolute;height:var(--rh);margin:0;padding:0 6px;border:1px solid color-mix(in srgb,var(--c) 70%,var(--surface));border-left-width:4px;background:color-mix(in srgb,var(--c) 18%,var(--surface));text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12.5px;line-height:calc(var(--rh) - 2px);border-radius:4px;color:var(--ink)}
.bar .m{color:var(--muted);font-size:11.5px;margin-left:6px}
.bar:hover{background:color-mix(in srgb,var(--c) 32%,var(--surface))}
.bar.hi{background:color-mix(in srgb,var(--c) 40%,var(--surface));box-shadow:inset 0 0 0 2px var(--accent)}
.bar.sel{background:color-mix(in srgb,var(--c) 55%,var(--surface));box-shadow:inset 0 0 0 3px var(--accent);z-index:2}
.bar.tiny{padding:0;color:transparent}
.t-background{--c:var(--t-background)}.t-method{--c:var(--t-method)}.t-result{--c:var(--t-result)}.t-discussion{--c:var(--t-discussion)}.t-appendix{--c:var(--t-appendix)}.t-front{--c:var(--t-front)}.t-back{--c:var(--t-back)}
.tree{list-style:none;margin:0;padding:0}
.tree ul{list-style:none;margin:0;padding-left:18px;border-left:1px dotted var(--line)}
.trow{display:flex;gap:6px;align-items:center;padding:2px 4px;border-radius:6px;min-height:30px}
.trow.hi{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.trow.sel{background:color-mix(in srgb,var(--accent) 24%,transparent);outline:2px solid var(--accent)}
.twist{width:26px;height:26px;border:0;background:none;padding:0;flex:0 0 auto;color:var(--muted)}
.twist[disabled]{visibility:hidden}
.tname{all:unset;cursor:pointer;flex:1 1 auto;min-width:0;padding:2px 4px;border-radius:4px}
.tname:hover{text-decoration:underline}
.tname:focus-visible{outline:3px solid var(--focus)}
.tmeta{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.tdot{width:10px;height:10px;border-radius:2px;background:var(--c);flex:0 0 auto}
/* links */
.graphwrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;position:relative}
svg.graph{display:block;width:100%;height:auto;max-height:78vh;touch-action:pan-y}
.gnode{cursor:pointer}
.gnode circle,.gnode rect{fill:color-mix(in srgb,var(--c) 22%,var(--surface));stroke:var(--c);stroke-width:2}
.gnode text{font-size:11px;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.gnode.hi circle,.gnode.hi rect{stroke-width:4;stroke:var(--accent)}
.gnode.sel circle,.gnode.sel rect{stroke-width:5;stroke:var(--accent);fill:color-mix(in srgb,var(--accent) 25%,var(--surface))}
.gnode:focus-visible{outline:none}
.gnode:focus-visible circle,.gnode:focus-visible rect{stroke:var(--focus);stroke-width:5}
.gedge{fill:none;stroke:var(--ec);opacity:.75}
.gedge.inferred{stroke-dasharray:7 5}
.gedge.dim{opacity:.12}
.gedge.hiE{opacity:1}
.ghit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.ghit:focus-visible{stroke:color-mix(in srgb,var(--focus) 35%,transparent)}
#tip{position:fixed;z-index:60;max-width:min(380px,90vw);background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:12.5px;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#tip b{font-weight:700}
.fgroup{border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:0;background:var(--surface);min-width:0}
.fgroup legend{font-size:12px;color:var(--muted);padding:0 4px}
.fgroup label{display:inline-flex;gap:5px;align-items:center;margin:2px 10px 2px 0;font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
table.edges{width:100%;border-collapse:collapse;font-size:12.5px}
table.edges th,table.edges td{text-align:left;vertical-align:top;padding:4px 6px;border-bottom:1px solid var(--line)}
.scroll-x{overflow-x:auto}
/* panel */
aside.panel{min-width:0}
.panel-in{position:sticky;top:112px;max-height:calc(100vh - 128px);overflow:auto;padding:14px 16px}
.panel h2{font-size:17px;line-height:1.3;margin:2px 0 6px}
.panel section{margin:12px 0}
.panel h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 4px}
.panel blockquote{margin:0;padding:6px 10px;border-left:4px solid var(--accent);background:var(--surface2);border-radius:0 6px 6px 0;font-style:italic}
.pclose{display:none}
.flow{display:flex;flex-wrap:wrap;gap:4px 2px;align-items:center;font-size:12.5px}
.flow span.s{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:1px 7px}
.claimcard{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);display:grid;gap:4px}
.claimcard.on{outline:2px solid var(--accent)}
.edgeitem{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px}
.edgeitem.inferred{border-style:dashed}
@media (max-width:1049px){
  aside.panel{position:fixed;left:0;right:0;bottom:0;z-index:50;transform:translateY(105%);transition:transform .2s}
  aside.panel.open{transform:none}
  .panel-in{position:static;max-height:68vh;border-radius:14px 14px 0 0;border:1px solid var(--line);background:var(--surface);box-shadow:0 -8px 24px rgba(0,0,0,.3)}
  .pclose{display:inline-flex;position:sticky;top:0;float:right}
  .toolbar{gap:6px 10px}
}
@media (max-width:760px){
  header.top{position:static}
  .top-in{padding:8px 12px;gap:6px 8px}
  .brand{flex:1 1 100%}.brand h1{font-size:15px}.brand p{display:none}
  .searchwrap{flex:1 1 0;min-width:0}
  .tabs .sub{display:none}
  .tabs button{min-height:44px}
  main{padding:10px 12px 40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.footer{max-width:1500px;margin:0 auto;padding:0 16px 30px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<a class="sr" href="#main">Skip to content</a>
<header class="top">
  <div class="top-in">
    <div class="brand"><h1 id="ttl"></h1><p id="subttl"></p></div>
    <div class="searchwrap">
      <label class="sr" for="q">Search titles, entities, claims and stages</label>
      <input id="q" type="search" placeholder="Search titles, entities, claims…" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
      <ul class="results" id="results" role="listbox" hidden></ul>
    </div>
    <button class="iconbtn" id="theme" type="button" aria-label="Toggle light or dark mode">Theme</button>
    <div class="tabs" role="tablist" aria-label="Views">
      <button role="tab" id="tab-journey" aria-controls="v-journey" aria-selected="true">Journey<span class="sub">the scientific story</span></button>
      <button role="tab" id="tab-structure" aria-controls="v-structure" aria-selected="false" tabindex="-1">Structure<span class="sub">how it is built</span></button>
      <button role="tab" id="tab-links" aria-controls="v-links" aria-selected="false" tabindex="-1">Links<span class="sub">how it connects</span></button>
    </div>
  </div>
</header>
<main id="main">
  <div>
    <section class="view" id="v-journey" role="tabpanel" aria-labelledby="tab-journey"></section>
    <section class="view" id="v-structure" role="tabpanel" aria-labelledby="tab-structure" hidden></section>
    <section class="view" id="v-links" role="tabpanel" aria-labelledby="tab-links" hidden></section>
  </div>
  <aside class="panel" id="panel" aria-label="Details of the selected item" aria-live="polite"><div class="card panel-in" id="panel-in"></div></aside>
</main>
<div class="footer" id="foot"></div>
<div id="tip" role="tooltip" hidden></div>
<script type="application/json" id="thesis-data">/*DATA*/</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById('thesis-data').textContent);
/* ---------------- helpers ---------------- */
const NS='http://www.w3.org/2000/svg';
function h(tag,props,...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='text') el.textContent=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else if(k==='style' && typeof v==='object') Object.assign(el.style,v);
    else el.setAttribute(k, v===true?'':String(v));
  }
  add(el,kids); return el;
}
function hs(tag,props,...kids){
  const el=document.createElementNS(NS,tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||v===false) continue;
    if(k==='class') el.setAttribute('class',v);
    else if(k==='text') el.textContent=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,String(v));
  }
  add(el,kids); return el;
}
function add(el,kids){ for(const k of kids.flat(Infinity)){ if(k==null||k===false) continue; el.append(k.nodeType?k:document.createTextNode(String(k))); } }
const $=(s,r=document)=>r.querySelector(s);
const fmt=n=>n.toLocaleString('en-GB');
const ROMAN=['','i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii','xiii','xiv','xv','xvi','xvii','xviii','xix','xx','xxi','xxii','xxiii','xxiv','xxv','xxvi','xxvii','xxviii','xxix','xxx'];
const lbl2n=l=>{const i=ROMAN.indexOf(l);return i>0?i:30+parseInt(l,10)};
const pg=p=>h('span',{class:'pg',title:'Printed page '+p+' (PDF page '+lbl2n(p)+')'},'p. '+p);
const pgs=(arr,max=99)=>{arr=[...new Set(arr||[])];const a=arr.slice(0,max);return h('span',{class:'chips'},a.map(pg),arr.length>max?h('span',{class:'muted small'},'+'+(arr.length-max)):null)};
function basisTag(b){return b?h('span',{class:'tag '+b,title:b==='stated'?'The author says this (solid outline)':'My inference from the text (dashed outline)'},b):null}
/* ---------------- data ---------------- */
const nodes=DATA.structure.nodes, N=Object.fromEntries(nodes.map(n=>[n.id,n])), order=Object.fromEntries(nodes.map((n,i)=>[n.id,i]));
const FIG=Object.fromEntries([...DATA.structure.figures,...DATA.structure.tables].map(f=>[f.id,f]));
const STAGES=DATA.journey.stages, ST=Object.fromEntries(STAGES.map(s=>[s.id,s]));
const NEG=DATA.journey.negative_results, CLAIMS=DATA.claims, CL=Object.fromEntries(CLAIMS.map(c=>[c.id,c]));
const ENT=Object.fromEntries(DATA.links.entities.map(e=>[e.id,e]));
const EDGES=DATA.links.edges;
const ancestors=id=>{const a=[];let n=N[id];while(n&&n.parent){a.push(n.parent);n=N[n.parent]}return a};
const topOf=id=>{if(FIG[id]) id=FIG[id].node; let n=N[id];while(n&&n.parent)n=N[n.parent];return n?n.id:null};

    if(o.length)P.append(sec('Links out ('+o.length+')',...o.slice(0,10).map(e=>mkE(e,'out')),o.length>10?h('details',{},h('summary',{class:'small',text:'show '+(o.length-10)+' more'}),...o.slice(10).map(e=>mkE(e,'out'))):null));
    if(i.length)P.append(sec('Links in ('+i.length+')',...i.slice(0,10).map(e=>mkE(e,'in')),i.length>10?h('details',{},h('summary',{class:'small',text:'show '+(i.length-10)+' more'}),...i.slice(10).map(e=>mkE(e,'in'))):null));
  }
  const ents=DATA.links.entities.filter(e=>n.level===0&&(e.chapters.includes(n.id)||e.appendices.includes(n.id)));
  if(ents.length){const box=h('div',{class:'chips'});ents.sort((a,b)=>b.by_chapter[n.id].mentions-a.by_chapter[n.id].mentions).slice(0,24).forEach(e=>box.append(h('button',{class:'chip',type:'button',title:e.gloss,onclick:()=>select('entity',e.id,{tab:'links'})},e.label+' ×'+e.by_chapter[n.id].mentions)));P.append(sec('Entities mentioned (top 24 of '+ents.length+')',box))}
  P.append(h('section',{},h('h4',{},'Show in'),h('div',{class:'chips'},h('button',{class:'chip',type:'button',onclick:()=>setTab('structure')},'Structure'),h('button',{class:'chip',type:'button',onclick:()=>setTab('journey')},'Journey'),h('button',{class:'chip',type:'button',onclick:()=>{ if(!GNODES.includes(topOf(n.id)))return; setTab('links')},disabled:!GNODES.includes(topOf(n.id))},'Links'))));
}
function panelEntity(P,e){
  P.append(h('div',{class:'chips'},h('span',{class:'tag'},e.kind),basisTag(e.basis)));
  P.append(h('h2',{text:e.label}),h('p',{text:e.gloss}));
  P.append(h('section',{},h('h4',{},'Appears in ('+e.total_mentions+' mentions)'),h('ul',{class:'plain'},Object.entries(e.by_chapter).map(([c,v])=>h('li',{},h('div',{class:'chips'},h('button',{class:'chip',type:'button',onclick:()=>select('node',c,{tab:'structure',scroll:true})},chapNum(c)),h('span',{class:'small'},v.mentions+' mention'+(v.mentions>1?'s':'')),pgs(v.pages)))))));
  P.append(h('p',{class:'small muted'},'Detected by text pattern in each chapter; page chips are the first pages where it occurs.'));
}
function panelClaim(P,c){P.append(h('h2',{text:'Claim'}),claimCard(c,true),h('section',{},h('h4',{},'Section'),linkNode(c.node)))}
function panelFig(P,f){
  P.append(h('div',{class:'chips'},h('span',{class:'tag'},f.id.startsWith('fig')?'figure':'table'),pg(f.page)),h('h2',{text:f.label}),h('p',{text:f.caption}),h('section',{},h('h4',{},'Located in'),linkNode(f.node)));
  const cl=CLAIMS.filter(c=>c.figures.includes(f.id));if(cl.length)P.append(h('section',{},h('h4',{},'Claims it supports'),...cl.map(c=>claimCard(c,true))));
  const es=EDGES.filter(e=>e.target===f.id);if(es.length)P.append(h('section',{},h('h4',{},'Cited from'),h('div',{class:'chips'},es.map(e=>linkNode(e.source)))));
}
function panelEdge(P,id){
  const [a,b,basis]=id.split('>');const g=groupEdges().find(x=>x.a===a&&x.b===b&&x.basis===basis);
  P.append(h('div',{class:'chips'},basisTag(basis)),h('h2',{},(SHORT[a]||a)+' → '+(SHORT[b]||b)));
  if(!g){P.append(h('p',{class:'muted'},'No links match the current filters.'));return}
  P.append(h('p',{class:'small muted'},g.items.length+' link'+(g.items.length>1?'s':'')+(basis==='stated'?' (stated, solid line)':' (inferred, dashed line)')));
  g.items.forEach(e=>P.append(h('div',{class:'edgeitem '+e.basis,style:{marginBottom:'6px'}},h('div',{class:'chips'},linkNode(e.source),'→',linkNode(e.target),h('span',{class:'tag'},ETYPES[e.type].l),pgs(e.source_pages,6)),h('div',{class:'small muted',text:e.reason}))));
}
/* ---------------- search ---------------- */
const INDEX=[];
nodes.forEach(n=>INDEX.push({g:'Structure',t:nodeLabel(n),x:(n.summary||'')+' '+n.title,sel:['node',n.id],tab:'structure',p:n.pages}));
STAGES.forEach((s,i)=>INDEX.push({g:'Journey stage',t:(i+1)+'. '+s.title,x:s.question+' '+s.approach,sel:['stage',s.id],tab:'journey',p:s.evidence.slice(0,3).map(x=>'p. '+x).join(', ')}));
DATA.links.entities.forEach(e=>INDEX.push({g:'Entity',t:e.label,x:e.gloss,sel:['entity',e.id],tab:'links',p:'p. '+e.source_pages[0]}));
CLAIMS.forEach(c=>INDEX.push({g:'Claim',t:c.text,x:'',sel:['claim',c.id],tab:null,p:c.source_pages.map(x=>'p. '+x).join(', ')}));
Object.values(FIG).forEach(f=>INDEX.push({g:f.id.startsWith('fig')?'Figure':'Table',t:f.label+' '+f.caption,x:'',sel:['fig',f.id],tab:'structure',p:'p. '+f.page}));
const qEl=$('#q'),rEl=$('#results');let act=-1,cur=[];
function runSearch(){
  const q=qEl.value.trim().toLowerCase();rEl.replaceChildren();act=-1;cur=[];
  if(q.length<2){rEl.hidden=true;qEl.setAttribute('aria-expanded','false');return}
  const terms=q.split(/\s+/);
  const sc=INDEX.map(it=>{const t=it.t.toLowerCase(),x=it.x.toLowerCase();let s=0;for(const w of terms){if(t.includes(w))s+=t.startsWith(w)?5:3;else if(x.includes(w))s+=1;else return null}return s?{it,s}:null}).filter(Boolean);
  const order=['Journey stage','Structure','Entity','Claim','Figure','Table'];
  const groups={};sc.forEach(r=>(groups[r.it.g]=groups[r.it.g]||[]).push(r));
  let n=0;
  for(const g of order){const arr=(groups[g]||[]).sort((a,b)=>b.s-a.s).slice(0,g==='Claim'||g==='Figure'?5:7);if(!arr.length)continue;
    rEl.append(h('li',{class:'grp',role:'presentation'},g+(groups[g].length>arr.length?' ('+groups[g].length+')':'')));
    arr.forEach(r=>{const li=h('li',{role:'option',id:'opt'+n,'aria-selected':'false'},h('span',{class:'rt',text:r.it.t.length>110?r.it.t.slice(0,108)+'…':r.it.t}),h('span',{class:'pg'},r.it.p||''));li.addEventListener('mousedown',e=>{e.preventDefault();choose(r.it)});rEl.append(li);cur.push({li,it:r.it});n++});}
  if(!n)rEl.append(h('li',{class:'grp',role:'presentation'},'No matches'));
  rEl.hidden=false;qEl.setAttribute('aria-expanded','true');
}
function choose(it){rEl.hidden=true;qEl.setAttribute('aria-expanded','false');qEl.value='';select(it.sel[0],it.sel[1],{tab:it.tab||undefined,scroll:true})}
qEl.addEventListener('input',runSearch);
qEl.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(rEl.hidden)runSearch();if(!cur.length)return;if(act>=0)cur[act].li.setAttribute('aria-selected','false');act=(act+(e.key==='ArrowDown'?1:-1)+cur.length)%cur.length;cur[act].li.setAttribute('aria-selected','true');qEl.setAttribute('aria-activedescendant',cur[act].li.id);cur[act].li.scrollIntoView({block:'nearest'})}
  else if(e.key==='Enter'){if(act>=0){e.preventDefault();choose(cur[act].it)}else if(cur.length){e.preventDefault();choose(cur[0].it)}}
  else if(e.key==='Escape'){rEl.hidden=true;qEl.setAttribute('aria-expanded','false')}
});
qEl.addEventListener('blur',()=>setTimeout(()=>{rEl.hidden=true;qEl.setAttribute('aria-expanded','false')},120));
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='SELECT'){e.preventDefault();qEl.focus()}if(e.key==='Escape'&&$('#panel').classList.contains('open')){$('#panel').classList.remove('open')}});
/* ---------------- render ---------------- */
function renderAll(){
  if(state.tab==='journey')renderJourney();
  else if(state.tab==='structure')renderStructure();
  else renderLinks();
  renderPanel();
}
function init(){
  $('#ttl').textContent=DATA.meta.title+': an interactive map';
  $('#subttl').textContent=DATA.meta.author+' · '+DATA.meta.institution+' · '+DATA.meta.date;
  $('#foot').textContent='Built from the thesis PDF text (pdftotext, '+DATA.meta.pdf_pages+' pages). All page references are printed page numbers. “Stated” = the author says it; “inferred” = my reading. Summaries are paraphrases; quotes are under 25 words and were checked against the page.';
  load();
  HI=relations(state.sel&&((state.sel.type==='node'&&N[state.sel.id])||(state.sel.type==='stage'&&ST[state.sel.id])||(state.sel.type==='entity'&&ENT[state.sel.id])||(state.sel.type==='claim'&&CL[state.sel.id])||(state.sel.type==='fig'&&FIG[state.sel.id])||state.sel.type==='edge')?state.sel:null);
  if(!HI.nodes.size&&!HI.stages.size&&!HI.ents.size)state.sel=state.sel&&state.sel.type==='edge'?state.sel:null;
  if(state.sel&&state.sel.type==='entity'&&ENT[state.sel.id])state.entKinds.add(ENT[state.sel.id].kind);
  if(state.sel)ensureVisible(state.sel);
  if(state.sel&&matchMedia('(max-width:1049px)').matches)$('#panel').classList.add('open');
  setTab(TABS.includes(state.tab)?state.tab:'journey',true);
}
window.addEventListener('resize',()=>{hideTip()});
init();
</script>
